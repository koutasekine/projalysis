        x += w;
      });
      out.push(row.id ? `<g data-id="${row.id}" data-start="${row.start}" data-end="${row.end}">${row.title ? `<title>${esc(row.title)}</title>` : ''}${g}</g>` : g);
      y += RH;
    }
    if (opts.collect && lastH2) {
      opts.collect.anchors.push({ kind: 'table', index: opts.collect.tables.length, label: lastH2.label, y: lastH2.y, fs: 14 });
      opts.collect.tables.push({ name: lastH2.label, header: cols.map((c) => c[0]), rows: rows.map((row) => row.cells.map((c) => String(typeof c === 'object' ? c.t : c))), frag: out.slice(o0).join(''), box: [M, y0, cols.reduce((a, c) => a + c[1], 0), y - y0] });
      lastH2 = null;
    }
  };
  // 横棒(部分の並び。[長さ, 塗りの属性])
  const bar = (parts, total, w = 420) => {
    y += 8;
    let x = M;
    out.push(`<rect x="${M}" y="${y}" width="${w}" height="16" fill="#fff" stroke="${COL.line}"/>`);
    for (const [v, fill] of parts) { if (!v || !total) continue; const bw = w * v / total; out.push(`<rect x="${x}" y="${y}" width="${bw}" height="16" ${fill}/>`); x += bw; }
    out.push(`<rect x="${M}" y="${y}" width="${w}" height="16" fill="none" stroke="${COL.line}"/>`);
    y += 16;
  };

  // 1. 計画の概要
  out.push(T_(M, y, `サマリー: ${r.sec.WBS.root.name}`, { fs: 15, weight: '600' }));
  h2('計画の概要');
  line(`期間: ${fmtDate(s0)} 〜 ${r.sec.end && r.sec.end.date !== null ? fmtDate(r.sec.end.date) : '(end: なし)'}${today !== null ? `   今日: ${fmtDate(today)}` : ''}`);
  line(summaryText(r)[0]);
  line(`タスク ${r.tasks.length} 件、担当者 ${r.members.length} 人`);

  // 2. タスクの進み具合
  h2('タスクの進み具合');
  const keys = Object.keys(STATUS);
  const cnt = Object.fromEntries(keys.map((k) => [k, r.tasks.filter((t) => t.status === k)]));
  const days = Object.fromEntries(keys.map((k) => [k, cnt[k].reduce((a, t) => a + t.days, 0)]));
  const totalDays = r.tasks.reduce((a, t) => a + t.days, 0);
  bar(['done', 'doing', 'blocked', 'todo'].map((k) => [days[k], statusAttr(k)]), totalDays);
  let lx = M + 436;
  out.push(T_(lx, y - 3, `完了 ${pct(days.done, totalDays)}(日数)、${pct(cnt.done.length, r.tasks.length)}(件数)`, { fs: FS, weight: '600' }));
  y += 6;
  table([['状態', 120], ['件数', 80, true], ['日数', 100, true]], keys.map((k) => ({ cells: [STATUS[k], `${cnt[k].length} 件`, `${fmtDays(days[k])} 日`] })).concat([{ cells: [{ t: '計', weight: '600' }, { t: `${r.tasks.length} 件`, weight: '600' }, { t: `${fmtDays(totalDays)} 日`, weight: '600' }] }]));

  // 3. 予定との比べ
  h2('予定との比べ');
  const plan = plannedByToday(r, today);
  if (plan === null) line('今日の日付がないため、比べられません。', { fill: COL.sub });
  else {
    const doneD = days.done;
    const diff = plan - doneD;
    line(`今日までに終わる予定: ${fmtDays(plan)} 日分(全体の ${pct(plan, totalDays)})`);
    line(`完了: ${fmtDays(doneD)} 日分(全体の ${pct(doneD, totalDays)})`);
    line(diff > 0 ? `予定より ${fmtDays(diff)} 日分遅れています` : diff < 0 ? `予定より ${fmtDays(-diff)} 日分進んでいます` : '予定どおりです', { fill: diff > 0 ? COL.accent : COL.text, fs: 13 });
    bar([[Math.min(doneD, totalDays), statusAttr('done')]], totalDays);
    if (totalDays > 0) { const px = M + 420 * Math.min(plan, totalDays) / totalDays; out.push(`<path d="M${px} ${y - 22}V${y + 6}" stroke="${COL.line}" stroke-width="2"/>` + T_(px, y + 18, '今日までの予定', { fs: 11, anchor: 'middle' })); y += 14; }
    out.push(T_(M + 436, y - 3 - 14, '灰色: 完了した日数', { fs: 11, fill: COL.sub }));
  }

  // 4. 遅れと問題発生
  h2('遅れと問題発生');
  const lates = r.tasks.filter((t) => isLate(r, t, today) || t.status === 'blocked');
  if (!lates.length) line(today === null ? '問題発生のタスクはありません(今日の日付がないため、遅れは調べていません)。' : '遅れと問題発生のタスクはありません。', { fill: COL.sub });
  else {
    y += 8;
    table([['管理番号', 80], ['タスク', 260], ['担当', 120], ['予定の終わり', 100], ['状態', 80], ['遅れ', 50]], lates.map((t) => {
      const late = isLate(r, t, today);
      return { id: t.id, start: t.start, end: t.end, title: r.qname(t), cells: [t.num, t.name, who(r, t.by) || '(なし)', fmtDate(s0 + t.d1), { t: STATUS[t.status], fill: t.status === 'blocked' ? COL.accent : undefined }, { t: late ? '遅れ' : '', fill: COL.accent, weight: '600' }] };
    }));
  }

  // 5. 担当者ごとの状況
  h2('担当者ごとの状況');
  y += 8;
  const prow = (name, list, m, i) => {
    const c = (k) => `${list.filter((t) => t.status === k).length}`;
    const nl = list.filter((t) => isLate(r, t, today)).length;
    return { id: m ? `m${i}` : null, start: m?.start, end: m?.end, cells: [m ? name : { t: name, fill: COL.sub }, c('todo'), c('doing'), c('done'), { t: c('blocked'), fill: c('blocked') !== '0' ? COL.accent : undefined }, { t: today === null ? '―' : `${nl}`, fill: nl ? COL.accent : undefined, weight: nl ? '600' : null }, `${fmtDays(list.reduce((a, t) => a + t.days, 0))} 日`] };
  };
  const prows = r.members.map((m, i) => prow(m.name, r.tasks.filter((t) => t.by.includes(m)), m, i));
  const none = r.tasks.filter((t) => !t.by.length);
  if (none.length) prows.push(prow('(担当なし)', none, null));
  table([['担当者', 120], ['実行前', 64, true], ['実行中', 64, true], ['完了', 64, true], ['問題発生', 72, true], ['遅れ', 56, true], ['作成の日数', 90, true]], prows);

  // 6. テスト項目(MOP)
  if (r.sec.FBS) {
    h2('テスト項目(MOP)');
    const all = r.bySec.FBS.flatMap((n) => n.mopChecked);
    const ok = all.filter(Boolean).length;
    if (!all.length) line('MOP はまだ書かれていません。', { fill: COL.sub });
    else {
      bar([[ok, `fill="${COL.blue}"`]], all.length);
      out.push(T_(M + 436, y - 3, `チェック済み ${ok} / ${all.length} 件(${pct(ok, all.length)})`, { fs: FS, weight: '600' }));
    }
  }

  // 7. 検査の警告
  h2('検査の警告');
  const ws = r.diags.filter((d) => d.level === 'warn');
  if (!ws.length) line('警告はありません。', { fill: COL.sub });
  else {
    y += 8;
    const known = SUM_CAT.map(([c, label]) => [label, ws.filter((d) => d.cat === c).length]).filter(([, n]) => n);
    const other = ws.filter((d) => !SUM_CAT.some(([c]) => c === d.cat)).length;
    if (other) known.push(['その他', other]);
    table([['項目', 220], ['件数', 80, true]], known.map(([l, n]) => ({ cells: [l, `${n} 件`] })).concat([{ cells: [{ t: '計', weight: '600' }, { t: `${ws.length} 件`, weight: '600' }] }]));
    line('警告の中身は、左下の診断の欄で見られます。', { fill: COL.sub, fs: 11 });
  }
  return wrapSvg(Math.max(W0, textW(`サマリー: ${r.sec.WBS.root.name}`, 15)) + 2 * M, y + M, out.join('')); // 題が図の幅に収まるように
}

const VIEWS = [
  { id: 'fbs', label: 'FBS', need: ['FBS'] },
  { id: 'pbs', label: 'PBS', need: ['PBS'] },
  { id: 'match', label: 'FBS と PBS の対応', need: ['FBS', 'PBS'] },
  { id: 'wbs', label: 'WBS', need: ['WBS'] },
  { id: 'aoa', label: 'アローダイアグラム', need: ['WBS'] },
  { id: 'roles', label: '役割分担', need: ['WBS', 'members'] },
  { id: 'gantt', label: 'ガントチャート', need: ['WBS', 'start'] },
  { id: 'people', label: '担当者別ガントチャート', need: ['WBS', 'start', 'members'] },
  { id: 'mop', label: 'テスト項目(MOP)', need: ['FBS'] },
  { id: 'summary', label: 'サマリー', need: ['WBS', 'start'] },
];
const GANTT_MAX_DAYS = 1096;
function render(r, view, opts = {}) {
  const v = VIEWS.find((x) => x.id === view);
  const miss = v.need.filter((k) => !r.sec[k]);
  if (miss.length) return { svg: null, message: `このビューには ${miss.map((k) => `「${k}:」`).join('と')}の節が必要です。テキストに書いていないので描けません。` };
  switch (view) {
    case 'fbs': return { svg: renderTree(r, 'FBS') };
    case 'pbs': return { svg: renderTree(r, 'PBS') };
    case 'match': return { svg: renderMatch(r) };
    case 'mop': return { svg: renderMop(r, { collect: opts.collect }) };
    case 'summary': return { svg: renderSummary(r, opts) };
    case 'wbs': return { svg: renderTree(r, 'WBS') };
    case 'aoa': return { svg: renderAOA(r, { collect: opts.collect }) };
    case 'roles': return { svg: renderRoles(r, { collect: opts.collect }) };
    case 'gantt': case 'people': {
      // 期間が長すぎると図が大きくなりすぎて固まるので、描かずに知らせる(仕様書 7.5 節)
      const { nDays } = figDays(r);
      if (nDays > GANTT_MAX_DAYS) return { svg: null, message: `ガントチャートの期間が ${nDays} 日あり、描ける長さ(${GANTT_MAX_DAYS} 日。約 3 年)を超えるので描きません。end: の日付や days: の値を確かめてください。` };
      return { svg: view === 'gantt' ? renderGantt(r, opts) : renderPeople(r, opts) };
    }
    default: return { svg: null, message: '' };
  }
}

// タスク t が、開始から時刻 T(1/1000 日)までに作業できる長さ(休みの日を除く)。ガントチャートのドラッグで使う(仕様書 11.3 節)
function workUntil(r, t, T) {
  let w = 0;
  for (let d = Math.floor(t.s / 1000); d * 1000 < T; d++) {
    const dn = r.sched.start + d;
    if (r.isOff(dn) || t.by.some((m) => r.memberOff(m, dn))) continue;
    w += Math.max(0, Math.min(T, (d + 1) * 1000) - Math.max(t.s, d * 1000));
  }
  return w;
}

// ---- 印刷のページ(仕様書 9 章)。1 ページに収めると元の大きさの半分より小さくなるビューは、ページを分ける
// 基準は A4 横(96 dpi で 1123 × 794 px)から内側の空き 10 mm ずつを引いた大きさ。サマリーは縦向きで、分けない
const PRINT_W = 1047, PRINT_H = 718, PRINT_MIN = 0.5;
const svgSize = (svg) => { const m = /width="(\d+)" height="(\d+)"/.exec(svg); return [+m[1], +m[2]]; };
// portrait: 縦向きのページ(幅と高さを入れ替える)
const printScale = (svg, portrait) => { const [w, h] = svgSize(svg); return portrait ? Math.min(1, PRINT_H / w, PRINT_W / h) : Math.min(1, PRINT_W / w, PRINT_H / h); };
// 行で区切る: draw([始め, 終わり)) が描くページを、縮み方が target 以上に収まる行数ずつに分ける
function splitRanges(n, draw, target, portrait) {
  const ranges = [];
  let a = 0;
  while (a < n) {
    let lo = 1, hi = n - a;
    while (lo < hi) { const mid = Math.ceil((lo + hi) / 2); if (printScale(draw([a, a + mid]), portrait) >= target) lo = mid; else hi = mid - 1; }
    ranges.push([a, a + lo]);
    a += lo;
  }
  return ranges;
}
const splitRows = (n, draw, target, portrait) => splitRanges(n, draw, target, portrait).map(draw);
// 表の行の目標の縮み方: 幅で決まる縮み方(高さでそれ以上は縮めない。幅のために半分より小さくなる表は、行で区切っても幅の分は縮む)
const rowTarget = (svg, portrait) => Math.min(1, (portrait ? PRINT_H : PRINT_W) / svgSize(svg)[0]);
// 縦向きで印刷するページ: サマリーと、分けたときのアローダイアグラムのタスクの表(1 ページ目の矢印の図より後)
const printPortrait = (view, i) => view === 'summary' || (view === 'aoa' && i > 0);
function printPages(r, view, opts = {}) {
  const full = render(r, view, opts);
  if (!full.svg) return [];
  if (view === 'summary' || printScale(full.svg) >= PRINT_MIN) return [full.svg];
  if (view === 'fbs' || view === 'pbs' || view === 'wbs') {
    // 木: 第 1 層の要素ごとに分ける。1 つでも半分より小さくなる要素は、その子ごとに分ける。小さいものは同じページにまとめる
    const key = view.toUpperCase(), root = r.sec[key].root;
    const sub = (n) => { const a = [n]; for (const c of n.children) a.push(...sub(c)); return a; };
    const draw = (units) => { const keep = new Set(); for (const u of units) { sub(u).forEach((x) => keep.add(x)); for (let a = u.parent; a; a = a.parent) keep.add(a); } return renderTree(r, key, { keep }); };
    let units = [...root.children];
    for (let changed = true; changed;) {
      changed = false;
      const next = [];
      for (const u of units) {
        if (u.children.some((c) => c.children.length) && printScale(draw([u])) < PRINT_MIN) { next.push(...u.children); changed = true; } else next.push(u);
      }
      units = next;
    }
    const pages = [];
    let cur = [], s0 = 1;
    for (const u of units) {
      if (cur.length && printScale(draw([...cur, u])) >= Math.min(s0, 0.75)) { cur.push(u); continue; }
      if (cur.length) pages.push(draw(cur));
      cur = [u]; s0 = printScale(draw(cur));
    }
    if (cur.length) pages.push(draw(cur));
    return pages;
  }
  if (view === 'roles') {
    const target = rowTarget(full.svg);
    const draw = (rows) => renderRoles(r, { rows, sum: false });
    const ranges = splitRanges(r.tasks.length, draw, target);
    const pages = ranges.map(draw);
    // 担当者ごとのまとめは、最後のページに入れば入れ、入らなければ次のページにする
    const withSum = renderRoles(r, { rows: ranges[ranges.length - 1] });
    if (printScale(withSum) >= target) pages[pages.length - 1] = withSum; else pages.push(renderRoles(r, { table: false }));
    return pages;
  }
  if (view === 'mop') {
    let n = 0;
    for (const x of r.bySec.FBS) n += x.mops.length + (x.parent && !x.children.length && !x.mops.length ? 1 : 0);
    return splitRows(n, (rows) => renderMop(r, { rows }), rowTarget(full.svg));
  }
  if (view === 'gantt') return splitRows(r.tasks.length, (rows) => renderGantt(r, { ...opts, rows }), rowTarget(full.svg));
  if (view === 'people') {
    const n = r.members.length + (r.tasks.some((t) => !t.by.length) ? 1 : 0);
    return splitRows(n, (rows) => renderPeople(r, { ...opts, rows }), rowTarget(full.svg));
  }
  if (view === 'aoa') {
    // アローダイアグラム: 矢印の図とタスクの表を別のページにし、表は縦向きのページで、収まらなければ行で区切る
    const tableFull = renderAOA(r, { part: 'table' });
    return [renderAOA(r, { part: 'diagram' }), ...splitRows(r.tasks.length, (rows) => renderAOA(r, { part: 'table', rows }), rowTarget(tableFull, true), true)];
  }
  return [full.svg];
}

// 選んだ要素の情報(画面の下の欄)
function describe(r, id, opts = {}) {
  if (/^m\d+$/.test(id)) { const m = r.members[+id.slice(1)]; return m ? { kind: '担当者', name: m.name, items: [m.off.length ? ['休み', offText(m.off)] : null, m.note ? ['note', m.note] : null].filter(Boolean) } : null; }
  const n = r.nodes.find((x) => x.id === id);
  if (!n) return null;
  const items = [];
  const kind = n.sec === 'WBS' ? (!n.parent ? 'WBS の根' : n.children.length ? 'WBS の要素' : 'タスク') : `${n.sec} の${n.parent ? '要素' : '根'}`;
  if (n.num) items.push(['管理番号', n.num]);
  if (n.sec === 'FBS' && n.mops.length) items.push(['MOP', n.mops.map((m, i) => `${n.mopChecked[i] ? '✓ ' : ''}${m}`).join(' / ')]);
  if (n.sec === 'PBS' && n.R.realizes?.length) items.push(['実現する機能', n.R.realizes.map((x) => x.name).join('、')]);
  if (n.sec === 'WBS') {
    if (n.for.length) items.push(['対象(for)', n.for.map((x) => x.name).join('、')]);
    if (n.by.length) items.push(['作成', n.by.map((x) => x.name).join('、')]);
    if (n.review.length) items.push(['確認', n.review.map((x) => x.name).join('、')]);
    if (n.parent && !n.children.length) {
      items.push(['日数', `${fmtDays(n.days)} 日`]);
      if (n.pred.length) items.push(['先行', n.pred.map((x) => x.name).join('、')]);
      items.push(['日程', `${fmtDate(r.sched.start + n.d0)} 〜 ${fmtDate(r.sched.start + n.d1)}`]);
      items.push(['余裕', `${fmtDays(n.TF)} 日${n.crit ? '(クリティカルパス)' : ''}`]);
      const today = opts.today ? parseDate(opts.today) : null;
      items.push(['状態', `${STATUS[n.status]}(${n.status})${isLate(r, n, today) ? '、遅れ' : ''}`]);
    }
  }
  if (n.note) items.push(['note', n.note]);
  return { kind, name: n.name, qname: r.qname(n), items };
}
function offText(list) { return list.map((o) => (o.type === 'wd' ? Object.keys(WD).find((k) => WD[k] === o.v) : o.type === 'd' ? fmtDate(o.v) : `${fmtDate(o.a)}..${fmtDate(o.b)}`)).join(', '); }

// ---- 生成 AI に渡す修正依頼の文
function toPrompt(diags, text) {
  const out = [];
  out.push('次の「プロジェクト計画」(https://plan.sapp.jp)のテキスト記法について、下の診断の内容を直したテキストを書いてください。');
  out.push('返すテキストはコードブロック(```)で囲まず、テキストだけを書いてください。見出し(#)・番号付きのリスト・太字(**)・説明の文の行は書けません(構文エラーになります)。');
  out.push('書き方の要点: 1 行目の「version: 日付」は保存した日で、アプリが書くので、そのまま残す(ほかの場所には書かない)。節は「start:」「end:」「off:」「members:」「FBS: 根の名前」「PBS: 根の名前」「WBS: 根の名前」。要素は「- 名前」の字下げで階層を作り、属性は名前の後ろに「予約語: 値」を並べる(FBS は mop: mop*:(チェック済みの MOP) note:、PBS は realizes: note:、WBS は for: days: by: review: after: status: note:)。複数の値はカンマ区切り。参照は名前で書き、同じ名前が複数あれば「親::子」と書く。メモは note: に書く。担当者の行には off:(その人の休み)と note: を書ける。// から行末までは注(行頭か空白の後の // だけ)。「* 」「+ 」で始まるリスト、** と __ は、太字のつもりでなくても書けない(__init__.py のような名前も不可)。status: はタスク(末端の要素)の状態で、todo(実行前)・doing(実行中)・done(完了)・blocked(問題発生)のどれか。書かなければ todo。');
  out.push('');
  const er = diags.filter((d) => d.level === 'error'), wr = diags.filter((d) => d.level === 'warn');
  if (er.length) { out.push('## エラー'); for (const d of er) out.push(`- ${d.line} 行: ${d.message}`); out.push(''); }
  if (wr.length) { out.push('## 警告'); for (const d of wr) out.push(`- ${d.line} 行: ${d.message}`); out.push(''); }
  out.push('## テキスト(「----- ここから -----」と「----- ここまで -----」の間)');
  out.push('----- ここから -----');
  out.push(text.replace(/^\uFEFF/, ''));
  out.push('----- ここまで -----');
  return out.join('\n');
}

// ---- 保存と読み込み(SVG に原文を埋め込む)
const META_ID = 'plan-source';
function b64enc(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
function b64dec(s) { const bin = atob(s.replace(/\s+/g, '')); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
function embedSource(svg, text) {
  const i = svg.indexOf('>', svg.indexOf('<svg'));
  const meta = `<metadata id="${META_ID}">${b64enc(new TextEncoder().encode(text))}</metadata>`;
  return '<?xml version="1.0" encoding="UTF-8"?>\n<!-- プロジェクト計画(https://plan.sapp.jp)で作った図。metadata に元のテキストを含み、このファイルをプロジェクト計画で開くと編集を続けられる -->\n'
    + svg.slice(0, i + 1) + meta + svg.slice(i + 1);
}
function extractSource(svgText) {
  const m = new RegExp(`<metadata id="${META_ID}">([A-Za-z0-9+/=\\s]*)</metadata>`).exec(svgText);
  if (!m) return { ok: false, error: 'この SVG にはテキストが埋め込まれていません(版 0.30 までに「画像…」で保存した .svg だけを開けます。図・表のボタンで保存した SVG にはテキストを入れていません)' };
  try { return { ok: true, text: new TextDecoder('utf-8', { fatal: true }).decode(b64dec(m[1])) }; }
  catch { return { ok: false, error: '埋め込まれたテキストが壊れています' }; }
}

// ================= 図からの編集(仕様書 11 章) =================
// テキストが正本。図での操作は、ここでテキストの書き換えに直す。どの関数も、解析し直す前の結果 r と
// 元のテキストから「新しいテキスト全体」を求めて返すだけで、図の側には状態を持たない。
// 戻り値は { text, select } か { error }。select は書き換えの後に選ぶ要素({ sec, qname } か { member })
const Edit = (() => {
  const RE_KW = /(^|[ \t])(realizes|for|days|by|review|after|status|note|mop\*?|off):/;
  const chain = (n) => { const a = []; for (let x = n; x; x = x.parent) a.unshift(x); return a; };
  const qn = (n) => chain(n).map((x) => x.name).join('::');
  const keyOf = (n) => (n.isMember ? { member: n.name } : { sec: n.sec, qname: qn(n) });
  const find = (r, id) => (/^m\d+$/.test(id) ? r.members[+id.slice(1)] : r.nodes.find((x) => x.id === id));
  const subtree = (n) => { const a = [n]; for (const c of n.children ?? []) a.push(...subtree(c)); return a; };
  const lastLineEnd = (n) => Math.max(...subtree(n).map((x) => x.lineEnd));
  const isAnc = (a, b) => { for (let x = b.parent; x; x = x.parent) if (x === a) return true; return false; };
  const fail = (error) => ({ error });

  // 書き換え(位置の並び)をテキストに当てる
  const apply = (text, edits) => {
    let t = text;
    for (const e of [...edits].sort((a, b) => b.start - a.start || b.end - a.end)) t = t.slice(0, e.start) + e.text + t.slice(e.end);
    return t;
  };
  // 元のテキストの位置が、書き換えの後のどこへ移るか。書き換えで消えた範囲の中なら null
  const mapPos = (edits, pos) => {
    let shift = 0;
    for (const e of edits) {
      if (e.end > e.start) { if (pos >= e.start && pos < e.end) return null; if (e.end <= pos) shift += e.text.length - (e.end - e.start); }
      else if (e.start <= pos) shift += e.text.length;
    }
    return pos + shift;
  };
  // 属性を前の空白ごと消す範囲
  const cutAttr = (text, at) => { let a = at.kstart; while (a > 0 && /[ \t]/.test(text[a - 1])) a--; return { start: a, end: at.end, text: '' }; };
  // 修飾名の候補(節の要素の並び list の中で、segs に当てはまるもの)
  const matches = (list, segs, noRoot) => list.filter((m) => {
    if (m.name !== segs[segs.length - 1] || (noRoot && !m.parent)) return false;
    let a = m.parent;
    for (let j = segs.length - 2; j >= 0; j--) { if (!a || a.name !== segs[j]) return false; a = a.parent; }
    return true;
  });
  // 参照に書く名前: その節で一意に決まる、いちばん短い修飾名
  function refName(list, n, noRoot) {
    const c = chain(n).map((x) => x.name);
    for (let k = 1; k <= c.length; k++) { const segs = c.slice(c.length - k); if (matches(list, segs, noRoot).length === 1) return segs.join('::'); }
    return c.join('::');
  }
  const secList = (nodes, sec) => nodes.filter((x) => x.sec === sec);

  // 名前や値に書けない文字列(書くと、同じ行の後ろの属性が注になったり、別の属性が始まったりする)
  function badText(v, what) {
    if (/(^|[ \t])\/\//.test(v)) return `${what}に「空白 + //」は書けません(そこから後ろが注になります)`;
    if (RE_KW.test(v)) return `${what}に「空白 + 予約語 + 半角コロン」は書けません(そこから別の属性と読まれます。全角のコロンを使ってください)`;
    if (/\*\*|__/.test(v)) return `${what}に ** と __ は書けません`;
    return null;
  }
  const badName = (name) => {
    if (!name.trim()) return '名前が空です';
    if (/[,]|::/.test(name)) return '名前に「,」と「::」は使えません';
    return badText(name, '名前');
  };

  // ---- 書き込む前の確認(仕様書 11.1 節)。書き換えの候補を解析し直し、次をすべて満たすときだけ書き込む
  //  1. 新しいエラーが出ない(削除だけは、消した要素への参照のエラーを認める)
  //  2. 対象でない要素は、親子関係・属性・参照先が変わらない
  //  3. 対象の要素は、意図したとおりになる(expect で確かめる)
  function commit(r, edits, o) {
    const text = apply(r.text, edits);
    const r2 = analyze(text);
    const p2 = r2.parse;
    const errs = r2.diags.filter((d) => d.level === 'error');
    if (errs.length && !(o.allowRefErrors && errs.every((d) => d.cat === '参照'))) return fail(`この書き換えをするとテキストがエラーになるので、書き換えませんでした(${errs[0].message})`);
    const at = (pos) => { const q = mapPos(edits, pos); return q === null ? null : q; };
    const byLine = new Map([...p2.nodes, ...p2.members].map((x) => [x.lineStart, x]));
    const nw = (n) => { const q = at(n.lineStart); return q === null ? null : byLine.get(q) ?? null; };
    const skip = o.skip ?? new Set(); // 対象の要素(属性の比較から外す)
    const sigA = (n, drop) => n.attrList.filter((a) => !drop.includes(a.key)).map((a) => `${a.key}:${a.refs ? '' : a.text}`).join('|');
    for (const n of [...r.nodes, ...r.members]) {
      if (o.removed?.has(n)) continue;
      const m = nw(n);
      if (!m) return fail('書き換えの位置がずれるため、書き換えませんでした(テキストの書き方を確かめてください)');
      if (!n.isMember) {
        const pOld = n.parent ? nw(n.parent) : null;
        if ((m.parent ?? null) !== pOld) return fail('字下げの幅がそろっていないため、この書き換えをすると別の要素の親子関係が変わります。テキストで字下げをそろえてから操作してください');
      }
      const drop = skip.has(n) ? (o.skipKeys ?? []) : [];
      if (!(o.renamed === n) && m.name !== n.name) return fail('書き換えで別の要素の名前が変わるため、書き換えませんでした');
      if (sigA(n, drop) !== sigA(m, drop)) return fail('書き換えで別の属性が変わるため、書き換えませんでした');
    }
    // 参照先が変わらない(対象の要素の、書き換えた属性を除く)
    if (r2.ok) {
      for (const n of [...r.nodes]) {
        if (o.removed?.has(n)) continue;
        const m = nw(n);
        for (const k of Object.keys(n.R ?? {})) {
          if (skip.has(n) && (o.skipKeys ?? []).includes(k)) continue;
          const a = n.R[k].map((x) => (x.isMember ? `m:${x.name === o.oldName && o.renamed === x ? o.newName : x.name}` : at(x.lineStart))).join(',');
          const b = (m.R?.[k] ?? []).map((x) => (x.isMember ? `m:${x.name}` : x.lineStart)).join(',');
          if (a !== b) return fail('書き換えで別の要素の参照先が変わるため、書き換えませんでした');
        }
      }
    }
    if (o.expect) { const e = o.expect(r2, nw); if (e) return fail(e); }
    return { text, select: o.select };
  }

  const isMop = (a) => a.key === 'mop' || a.key === 'mop*';
  // MOP の並び(mop: と mop*:)を書き換える(仕様書 11.2 節)。
  // 元の文と同じ文は、チェック済みかどうかを引き継ぐ(並べ替えても同じ。同じ文が 2 つ以上あれば、チェック済みを先に引き継ぐ)。
  // 同じ文の間で変わった文は、元の位置で文だけを置き換え、予約語(mop: か mop*:)はそのまま残す。
  // 元にない文は、並びの位置に mop: で足し、減った文は消す
  function setMops(r, n, list) {
    const text = r.text, olds = n.attrList.filter(isMop);
    const A = olds.map((a) => a.text), B = list;
    // 最長共通部分列で、変わらない文を決める
    const L = Array.from({ length: A.length + 1 }, () => new Array(B.length + 1).fill(0));
    for (let i = A.length - 1; i >= 0; i--) for (let j = B.length - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    const anchors = [];
    for (let i = 0, j = 0; i < A.length && j < B.length;) { if (A[i] === B[j]) { anchors.push([i, j]); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++; }
    anchors.push([A.length, B.length]);
    const edits = [], ins = new Map(), want = [];
    let pi = 0, pj = 0, lastEnd = null; // lastEnd: 直前に残る(または置き換える)MOP の終わりの位置
    const insert = (v, key) => {
      if (lastEnd !== null) { ins.set(lastEnd, `${ins.get(lastEnd) ?? ''} ${key}: ${v}`); return; }
      const first = olds.find((a, i) => i >= pi && !cutSet.has(i));
      if (first) { const k = first.kstart; ins.set(k, `${ins.get(k) ?? ''}${key}: ${v} `); } else ins.set(n.end, `${ins.get(n.end) ?? ''} ${key}: ${v}`);
    };
    // 消す MOP を先に決める(足す位置を、残る MOP の前後から選ぶため)
    const cutSet = new Set();
    { let a0 = 0, b0 = 0; for (const [ai, bj] of anchors) { const og = ai - a0, ng = bj - b0; for (let k = ng; k < og; k++) cutSet.add(a0 + k); a0 = ai + 1; b0 = bj + 1; } }
    // 消す MOP のうち、同じ文が並びのどこかに残るものは、そのチェックを引き継ぐ(並べ替えたとき)
    const spare = new Map(); // 文 → 消す MOP の予約語の並び
    for (const i of cutSet) { const t = A[i]; if (!spare.has(t)) spare.set(t, []); spare.get(t).push(olds[i].key); }
    const take = (t, onlyChecked) => {
      const l = spare.get(t);
      if (!l) return null;
      const k = l.indexOf('mop*');
      if (k >= 0) { l.splice(k, 1); return 'mop*'; }
      if (onlyChecked || !l.length) return null;
      return l.shift();
    };
    for (const [ai, bj] of anchors) {
      const og = ai - pi, ng = bj - pj;
      for (let k = 0; k < Math.max(og, ng); k++) {
        if (k < og && k < ng) { const a = olds[pi + k]; edits.push({ start: a.kstart, end: a.end, text: `${a.key}: ${B[pj + k]}` }); want.push(`${a.key}\u0002${B[pj + k]}`); lastEnd = a.end; }
        else if (k < og) edits.push(cutAttr(text, olds[pi + k]));
        else { const key = take(B[pj + k], false) ?? 'mop'; insert(B[pj + k], key); want.push(`${key}\u0002${B[pj + k]}`); }
      }
      if (ai < A.length) {
        const a = olds[ai];
        // 同じ文の未チェックを残し、チェック済みを消すことになるときは、残す方をチェック済みにする
        const up = a.key === 'mop' && take(A[ai], true);
        if (up) edits.push({ start: a.kstart, end: a.kstart + a.key.length, text: 'mop*' });
        want.push(`${up ? 'mop*' : a.key}\u0002${A[ai]}`); lastEnd = a.end;
      }
      pi = ai + 1; pj = bj + 1;
    }
    for (const [pos, t] of ins) edits.push({ start: pos, end: pos, text: t });
    if (!edits.length) return { text, select: keyOf(n) };
    return commit(r, edits, {
      skip: new Set([n]), skipKeys: ['mop', 'mop*'], select: keyOf(n),
      expect: (r2, nw) => (nw(n).attrList.filter(isMop).map((a) => `${a.key}\u0002${a.text}`).join('\u0001') === want.join('\u0001') ? null : 'MOP を書いたとおりに読めないので、書き換えませんでした'),
    });
  }
  // MOP のチェックを切り替える(mop: と mop*: の予約語だけを書き換える)。index は、その行の MOP の何番目か
  function setMopChecked(r, id, index, checked) {
    const n = find(r, id);
    if (!n || n.sec !== 'FBS') return fail('FBS の要素が見つかりません');
    const olds = n.attrList.filter(isMop);
    const a = olds[index];
    if (!a) return fail('MOP が見つかりません');
    const key = checked ? 'mop*' : 'mop';
    if (a.key === key) return { text: r.text, select: keyOf(n) };
    const want = olds.map((x) => `${x === a ? key : x.key}\u0002${x.text}`).join('\u0001');
    return commit(r, [{ start: a.kstart, end: a.kstart + a.key.length, text: key }], {
      skip: new Set([n]), skipKeys: ['mop', 'mop*'], select: keyOf(n),
      expect: (r2, nw) => (nw(n).attrList.filter(isMop).map((x) => `${x.key}\u0002${x.text}`).join('\u0001') === want ? null : 'MOP のチェックを書いたとおりに読めないので、書き換えませんでした'),
    });
  }

  // 属性を書き換える。value が空なら属性を消す。mop は値の配列(setMops)
  function setAttr(r, id, key, value) {
    const n = find(r, id);
    if (!n) return fail('要素が見つかりません');
    if (key === 'mop') {
      const list = (Array.isArray(value) ? value : [value]).map((v) => String(v).trim()).filter(Boolean);
      for (const v of list) { const b = badText(v, '値'); if (b) return fail(b); }
      return setMops(r, n, list);
    }
    const text = r.text;
    const edits = [];
    const list = key === 'mop' ? (Array.isArray(value) ? value : [value]).map((v) => String(v).trim()).filter(Boolean) : [String(value).trim()].filter(Boolean);
    for (const v of list) { const b = badText(v, '値'); if (b) return fail(b); }
    if (key !== 'mop' && key !== 'note' && list[0] && /(^|[ \t])\/\//.test(list[0])) return fail('値に「空白 + //」は書けません');
    const olds = n.attrList.filter((a) => a.key === key);
    // 元の位置のまま置き換え、余れば消し、足りなければ行の終わりに足す
    olds.forEach((a, i) => edits.push(i < list.length ? { start: a.kstart, end: a.end, text: `${key}: ${list[i]}` } : cutAttr(text, a)));
    if (list.length > olds.length) edits.push({ start: n.end, end: n.end, text: list.slice(olds.length).map((v) => ` ${key}: ${v}`).join('') });
    if (!edits.length) return { text, select: keyOf(n) };
    return commit(r, edits, {
      skip: new Set([n]), skipKeys: [key], select: keyOf(n),
      expect: (r2, nw) => {
        const m = nw(n);
        const got = m.attrList.filter((a) => a.key === key).map((a) => a.text);
        return got.join('\u0001') === list.join('\u0001') ? null : `「${key}:」の値を、書いたとおりに読めないので、書き換えませんでした`;
      },
    });
  }

  // 名前を変える。その要素(と下位の要素)を指す参照も新しい名前に書き換え、曖昧になる参照は修飾名を付け直す
  function rename(r, id, newName0) {
    const n = find(r, id);
    if (!n) return fail('要素が見つかりません');
    const newName = newName0.trim();
    const bad = badName(newName);
    if (bad) return fail(bad);
    if (newName === n.name) return { text: r.text, select: keyOf(n) };
    const sibs = n.isMember ? r.members : n.parent ? n.parent.children : [];
    if (sibs.some((x) => x !== n && x.name === newName)) return fail(n.isMember ? `担当者に「${newName}」がすでにいます` : `同じ親の下に「${newName}」がすでにあります`);
    const edits = [{ start: n.nameStart, end: n.nameEnd, text: newName }];
    const refs = [];
    for (const m of [...r.nodes, ...r.members]) for (const at of m.attrList) for (const ref of at.refs ?? []) if (ref.node) refs.push(ref);
    const newText = new Map(); // 参照 → 書き換えた後の文字列
    for (const ref of refs) {
      const d = ref.node;
      if (n.isMember) { if (d === n) newText.set(ref, newName); continue; }
      if (d.isMember || !(d === n || isAnc(n, d))) continue;
      const c = chain(d);
      const k = c.indexOf(n), off = c.length - ref.segs.length;
      if (k < off) continue;
      const segs = [...ref.segs];
      segs[k - off] = newName;
      newText.set(ref, segs.join('::'));
    }
    for (const [ref, t] of newText) edits.push({ start: ref.start, end: ref.end, text: t });
    // 書き換えた後の木で、曖昧になる参照には修飾名を付け直す
    if (!n.isMember) {
      const t1 = apply(r.text, edits);
      const p1 = parse(t1);
      const byLine = new Map(p1.nodes.map((x) => [x.lineStart, x]));
      for (const ref of refs) {
        if (ref.node.isMember) continue;
        const cur = newText.get(ref) ?? ref.text;
        const list = secList(p1.nodes, ref.node.sec);
        const noRoot = !!ref.noRoot;
        if (matches(list, cur.split('::').map((s) => s.trim()), noRoot).length === 1) continue;
        const d1 = byLine.get(mapPos(edits, ref.node.lineStart));
        if (!d1) continue;
        const name = refName(list, d1, noRoot);
        const i = edits.findIndex((e) => e.start === ref.start && e.end === ref.end);
        if (i >= 0) edits[i] = { start: ref.start, end: ref.end, text: name }; else edits.push({ start: ref.start, end: ref.end, text: name });
      }
    }
    const sel = n.isMember ? { member: newName } : { sec: n.sec, qname: qn(n).split('::').slice(0, -1).concat(newName).join('::') };
    return commit(r, edits, { renamed: n, oldName: n.name, newName, select: sel, expect: (r2, nw) => (nw(n)?.name === newName ? null : '名前を書いたとおりに読めないので、書き換えませんでした') });
  }

  const uniqueName = (sibs, base) => { let name = base, i = 2; while (sibs.some((x) => x.name === name)) name = `${base}${i++}`; return name; };
  // 子を足す: 下位の要素の最後の行の後ろに、最後の子と同じ字下げで(子がなければ親の字下げに空白 2 個を足して)
  function addChild(r, id) {
    const n = find(r, id);
    if (!n || n.isMember) return fail('子を足せない要素です');
    const name = uniqueName(n.children, '新しい要素');
    const lc = n.children[n.children.length - 1];
    const lead = lc ? lc.lead : n.parent ? `${n.lead}  ` : '';
    const at = lastLineEnd(n);
    return commit(r, [{ start: at, end: at, text: `\n${lead}- ${name}` }], {
      select: { sec: n.sec, qname: `${qn(n)}::${name}` },
      expect: (r2) => (r2.parse.nodes.some((x) => x.name === name && x.parent && x.parent.lineStart === n.lineStart) ? null : '足した要素が、この要素の子として読めないので、書き換えませんでした(字下げをそろえてください)'),
    });
  }
  function addSibling(r, id) {
    const n = find(r, id);
    if (!n) return fail('要素が見つかりません');
    if (!n.isMember && !n.parent) return fail('根には兄弟を足せません');
    const sibs = n.isMember ? r.members : n.parent.children;
    const name = uniqueName(sibs, n.isMember ? '新しい担当者' : '新しい要素');
    const at = n.isMember ? n.lineEnd : lastLineEnd(n);
    const parentLine = n.isMember ? null : mapPos([], n.parent.lineStart);
    return commit(r, [{ start: at, end: at, text: `\n${n.lead}- ${name}` }], {
      select: n.isMember ? { member: name } : { sec: n.sec, qname: `${qn(n.parent)}::${name}` },
      expect: (r2) => (n.isMember ? (r2.parse.members.some((m) => m.name === name) ? null : '担当者を足せませんでした')
        : (r2.parse.nodes.some((x) => x.name === name && x.parent && x.parent.lineStart === parentLine) ? null : '足した要素が兄弟として読めないので、書き換えませんでした(字下げをそろえてください)')),
    });
  }
  // 消す(下位の要素の行も)。消す要素を指している参照の数も返す(画面で確認に使う)。消した要素への参照のエラーだけは認める
  function remove(r, id) {
    const n = find(r, id);
    if (!n) return fail('要素が見つかりません');
    if (!n.isMember && !n.parent) return fail('根は消せません(節ごと消すときはテキストで消してください)');
    const gone = new Set(n.isMember ? [n] : subtree(n));
    let refs = 0;
    for (const m of [...r.nodes, ...r.members]) if (!gone.has(m)) for (const at of m.attrList) for (const ref of at.refs ?? []) if (gone.has(ref.node)) refs++;
    const end = n.isMember ? n.lineEnd : lastLineEnd(n);
    const t = r.text;
    const range = end < t.length ? { start: n.lineStart, end: end + 1, text: '' } : { start: Math.max(0, n.lineStart - 1), end, text: '' };

  const removed = tA.filter((t) => !W.map.has(t) || !isTask(W.map.get(t))).map((t) => ({ t, note: W.map.has(t) ? '(子要素ができた)' : '' }));
  const pairs = tA.filter((t) => W.map.has(t) && isTask(W.map.get(t))).map((t) => [t, W.map.get(t)]).sort((x, y) => x[1].order - y[1].order);
  const moved = pairs.filter(([x]) => W.moved.has(x)).map(([x, y]) => ({ key: disp(y), from: parentDisp(x), to: parentDisp(y) }));
  const ref = (m, nodesA, nodesB) => setEq(nodesA.map((n) => (m.map.has(n) ? `B${m.map.get(n).id}` : `A${n.id}`)), nodesB.map((n) => `B${n.id}`));
  const changed = [], status = [], changedN = [];
  for (const [x, y] of pairs) {
    const items = [];
    if (x.days !== y.days) items.push(['日数', P.fmtDays(x.days), P.fmtDays(y.days)]);
    const nm = (l) => l.map((m) => m.name);
    if (!setEq(nm(x.by), nm(y.by))) items.push(['作成者', listText(nm(x.by)), listText(nm(y.by))]);
    if (!setEq(nm(x.review), nm(y.review))) items.push(['確認者', listText(nm(x.review)), listText(nm(y.review))]);
    if (!ref(M.PBS, x.for, y.for)) items.push(['対象', listText(x.for.map(disp)), listText(y.for.map(disp))]);
    const pa = effAfter(x), pb = effAfter(y);
    if (!ref(W, pa, pb)) items.push(['先行', listText(pa.map(disp)), listText(pb.map(disp))]);
    if ((x.note ?? '') !== (y.note ?? '')) items.push(['メモ', x.note ?? 'なし', y.note ?? 'なし']);
    if (items.length) { changed.push({ key: disp(y), items }); changedN.push(y); }
    if (x.status !== y.status) status.push({ key: disp(y), from: P.STATUS[x.status], to: P.STATUS[y.status] });
  }
  const taskRow = (t) => [P.fmtDays(t.days), listText(t.by.map((m) => m.name)), listText(t.review.map((m) => m.name))];

  // ---- 日程(仕様書 5.5 節)
  const sched = pairs.map(([x, y]) => {
    const ea = rA.sched.start + x.d1, eb = rB.sched.start + y.d1;
    return { key: disp(y), a: P.fmtDate(ea), b: P.fmtDate(eb), diff: eb - ea };
  });
  const maxDiff = sched.length ? Math.max(...sched.map((s) => s.diff)) : 0;
  const worst = maxDiff > 0 ? sched.filter((s) => s.diff === maxDiff) : [];

  // ---- FBS・PBS・MOP(仕様書 5.6 節)
  // 増えた・消えた要素は [対応名, MOP の文(FBS だけ。チェック済みには ✓)]
  const mopsOf = (n) => (n.mops.length ? n.mops.map((t, i) => `${n.mopChecked[i] ? '✓ ' : ''}${t}`).join(' / ') : 'なし');
  const tree = (m) => ({
    show: m.hasA || m.hasB,
    added: m.B.filter((n) => !m.inv.has(n)).map((n) => [disp(n), mopsOf(n)]),
    removed: m.A.filter((n) => !m.map.has(n)).map((n) => [disp(n), mopsOf(n)]),
    moved: m.A.filter((n) => m.moved.has(n)).sort((x, y) => m.map.get(x).order - m.map.get(y).order).map((n) => ({ key: disp(m.map.get(n)), from: parentDisp(n), to: parentDisp(m.map.get(n)) })),
  });
  const mop = { show: M.FBS.hasA || M.FBS.hasB, added: [], removed: [], checked: [], unchecked: [] };
  const fPairs = [...M.FBS.map].sort((x, y) => x[1].order - y[1].order);
  for (const [x, y] of fPairs) {
    const used = new Set();
    const mi = x.mops.map((t) => { const j = y.mops.findIndex((u, k) => u === t && !used.has(k)); if (j >= 0) used.add(j); return j; });
    x.mops.forEach((t, i) => {
      const j = mi[i];
      if (j < 0) { mop.removed.push([disp(y), t]); return; }
      if (!x.mopChecked[i] && y.mopChecked[j]) mop.checked.push([disp(y), t]);
      if (x.mopChecked[i] && !y.mopChecked[j]) mop.unchecked.push([disp(y), t]);
    });
    y.mops.forEach((t, j) => { if (!used.has(j)) mop.added.push([disp(y), t]); });
  }

  // ---- 担当者(仕様書 5.7 節)
  const lA = P.peopleLoad(rA), lB = P.peopleLoad(rB);
  const daysOf = (l, name) => l.rows.find((x) => x.m.name === name).days;
  const people = {
    added: namesB.filter((n) => !namesA.includes(n)),
    removed: namesA.filter((n) => !namesB.includes(n)),
    rows: namesB.filter((n) => namesA.includes(n)).map((n) => ({ name: n, a: daysOf(lA, n), b: daysOf(lB, n) })),
    off: [],
  };
  if (lA.none || lB.none) people.rows.push({ name: '(担当なし)', a: lA.none ? lA.none.days : 0, b: lB.none ? lB.none.days : 0 });
  for (const n of both) {
    const oa = memberOff(rA.members.find((m) => m.name === n)), ob = memberOff(rB.members.find((m) => m.name === n));
    if (offKey(oa) !== offKey(ob)) people.off.push({ name: n, a: oa || 'なし', b: ob || 'なし' });
  }
  return {
    a, b, roots, counts,
    tasks: {
      added: added.map(({ t, note }) => [disp(t) + note, ...taskRow(t)]),
      removed: removed.map(({ t, note }) => [disp(t) + note, ...taskRow(t)]),
      moved, changed, status,
    },
    // 要素そのもの(推移の図 I とガントチャートで使う。5.4 節の判定と同じもの)
    _n: { added: added.map((x) => x.t), removed: removed.map((x) => x.t), pairs, moved: pairs.filter(([x]) => W.moved.has(x)), changed: changedN },
    sched: { rows: sched, worst, maxDiff },
    fbs: tree(M.FBS), pbs: tree(M.PBS), mop, people,
  };
}

// ================= 表と図(SVG の文字列。仕様書 6 章) =================
const FONT = "'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Meiryo','Segoe UI',sans-serif";
const COL = { line: '#333', grid: '#c8c8c4', head: '#f4f4f2', text: '#222', sub: '#666' };
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const charW = (ch, fs) => (/[\u0000-\u024f\uff61-\uff9f]/.test(ch) ? 0.6 : 1) * fs;
const textW = (s, fs) => [...s].reduce((a, ch) => a + charW(ch, fs), 0);
function wrap(s, maxW, fs) {
  const out = [];
  let cur = '', w = 0;
  for (const ch of s) {
    const cw = charW(ch, fs);
    if (w + cw > maxW && cur) { out.push(cur); cur = ''; w = 0; }
    cur += ch; w += cw;
  }
  if (cur) out.push(cur);
  return out.length ? out : [''];
}
const T_ = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.fs ?? 13}"${o.fill ? ` fill="${o.fill}"` : ''}${o.weight ? ` font-weight="${o.weight}"` : ''}>${esc(s)}</text>`;
const wrapSvg = (w, h, body) => `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.ceil(w)}" height="${Math.ceil(h)}" viewBox="0 0 ${Math.ceil(w)} ${Math.ceil(h)}" font-family="${esc(FONT)}"><rect x="0" y="0" width="${Math.ceil(w)}" height="${Math.ceil(h)}" fill="#fff"/>${body}</svg>`;
const M = 20, FS = 12, LH = 16, PX = 6, PY = 5, MAXCOL = 320;

// 表: { title, header: [...], rows: [{ cells: [文字 か { t, bold }], group }] }。group が同じ連続した行は 1 列目をまとめたセルにする
const cellT = (c) => (typeof c === 'string' ? c : c.t);
function colWidths(tbl) {
  const n = tbl.header.length;
  // 列の幅の上限は MAXCOL。表ごとに列を指定して広げられる(tbl.maxw: { 列の番号: 幅 })
  return Array.from({ length: n }, (_, j) => Math.min(tbl.maxw?.[j] ?? MAXCOL, Math.max(textW(tbl.header[j], FS), ...tbl.rows.map((r) => textW(cellT(r.cells[j]), FS))) + 2 * PX));
}
const rowLines = (row, ws) => row.cells.map((c, j) => wrap(cellT(c), ws[j] - 2 * PX, FS));
const rowH = (lines) => Math.max(...lines.map((l) => l.length)) * LH + 2 * PY;
// 表の高さ(rows の範囲だけ)
function tableH(tbl, ws, rows) { const hh = rowH(tbl.header.map((h, j) => wrap(h, ws[j] - 2 * PX, FS))); return hh + rows.reduce((a, r) => a + rowH(rowLines(r, ws)), 0); }
function drawTable(tbl, ws, rows, x0, y0) {
  const out = [];
  const xs = [x0]; for (const w of ws) xs.push(xs[xs.length - 1] + w);
  const cell = (x, y, w, h, lines, o = {}) => {
    out.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${o.fill ?? '#fff'}" stroke="${COL.grid}"/>`);
    lines.forEach((l, k) => out.push(T_(x + PX, y + PY + LH * k + 12, l, { fs: FS, weight: o.bold ? '600' : null })));
  };
  const hl = tbl.header.map((h, j) => wrap(h, ws[j] - 2 * PX, FS));
  const hh = rowH(hl);
  hl.forEach((l, j) => cell(xs[j], y0, ws[j], hh, l, { fill: COL.head, bold: true }));
  let y = y0 + hh;
  const geo = rows.map((r) => { const l = rowLines(r, ws); return { r, l, h: rowH(l) }; });
  // まとめる列の数(先頭から。既定は 1 列目だけ)
  const nm = tbl.merge ?? 1;
  for (let i = 0; i < geo.length; i++) {
    const g = geo[i];
    const bold = (j) => typeof g.r.cells[j] === 'object' && g.r.cells[j].bold;
    const mark = out.length;
    // まとめたセル: 同じ group の連続した行の高さを合わせて 1 つに描く
    let start = nm;
    if (g.r.group != null) {
      const first = i === 0 || geo[i - 1].r.group !== g.r.group;
      if (first) {
        let h = 0;
        for (let k = i; k < geo.length && geo[k].r.group === g.r.group; k++) h += geo[k].h;
        for (let j = 0; j < nm; j++) cell(xs[j], y, ws[j], h, g.l[j], { bold: bold(j) });
      }
    } else start = 0;
    for (let j = start; j < ws.length; j++) cell(xs[j], y, ws[j], g.h, g.l[j], { bold: bold(j) });
    // 行を押すと比べる 2 つの版を選ぶ(改訂履歴。5.13 節)
    if (g.r.ver != null) { out.splice(mark, 0, `<g data-ver="${g.r.ver}">`); out.push('</g>'); }
    y += g.h;
  }
  return { body: out.join(''), h: y - y0, w: xs[xs.length - 1] - x0 };
}

// ビューの部品: { kind: 'text', text, fs, weight, fill } か { kind: 'table', tbl }
const txt = (text, o = {}) => ({ kind: 'text', text, fs: o.fs ?? 13, weight: o.weight ?? null, fill: o.fill ?? null });
// 文は TEXT_W で折り返す(長い 1 行で図の幅が広がり、印刷で縮みすぎないため)
const TEXT_W = 900;
const textLines = (b) => wrap(b.text, TEXT_W, b.fs);
const blockH = (b) => (b.kind === 'text' ? b.fs + (textLines(b).length - 1) * (b.fs + 6) + 10 : b.kind === 'gap' ? b.h : 0);
// 部品を上から並べて 1 枚の SVG にする。ws: 表ごとの列の幅(印刷で分けたときも全体と同じ幅にするため)
// anchors: 題の位置を集める配列(画面で題の右にボタンを置くため。仕様書 6.2 節・7.3 節)。図そのものには何も足さない
function compose(blocks, anchors = null) {
  const out = [];
  let y = M, w = 0;
  for (const b of blocks) {
    if (b.kind === 'text') {
      const top = y, ls = textLines(b);
      ls.forEach((l, k) => { y += k ? b.fs + 6 : b.fs; out.push(T_(M, y, l, { fs: b.fs, weight: b.weight, fill: b.fill })); w = Math.max(w, textW(l, b.fs)); });
      // label: 題の最後の行(画面で文字の範囲を測って、ボタンの位置を合わせるため)
      if (anchors && b.anchor) anchors.push({ ...b.anchor, label: ls[ls.length - 1], x: M + textW(ls[ls.length - 1], b.fs) + 6, y: y - b.fs });
      y += 10; continue;
    }
    if (b.kind === 'gap') { y += b.h; continue; }
    if (b.kind === 'fig') { out.push(`<g transform="translate(${M},${y})">${b.body}</g>`); w = Math.max(w, b.w); y += b.h + 6; continue; }
    const ws = b.ws ?? colWidths(b.tbl);
    const d = drawTable(b.tbl, ws, b.rows ?? b.tbl.rows, M, y);
    out.push(d.body); w = Math.max(w, d.w); y += d.h + 6;
  }
  return wrapSvg(w + 2 * M, y + M - 6, out.join(''));
}

// 表の部品と、コピー・表の画像の保存の対象。空の表は「なし」の文にする(仕様書 5.8 節)
function section(blocks, tables, title, header, rows, o = {}) {
  if (!rows.length) { blocks.push(txt(`${title}: なし`, { fs: 13 })); return; }
  const tb = txt(o.noCount ? title : `${title}(${rows.length} 件)`, { fs: 13, weight: '600' });
  blocks.push(tb);
  const tbl = { title, header, rows: rows.map((r) => (Array.isArray(r) ? { cells: r } : r)) };
  tb.anchor = { kind: 'table', ref: tbl };
  blocks.push({ kind: 'table', tbl });
  tables.push(tbl);
}
const heading = (blocks, s) => { blocks.push({ kind: 'gap', h: 6 }); blocks.push(txt(s, { fs: 15, weight: '600' })); };

// ================= 推移とガントチャートと見積もりの変化(仕様書 5.5・5.9〜5.12 節) =================
// 状態の色はプロジェクト計画のガントチャートと同じ(実行前は白地に黒枠、実行中は青、完了は薄い灰、問題発生はえんじ)
const STATUS_FILL = { todo: '#fff', doing: '#2b8fd8', done: '#bdbdb8', blocked: '#8b1a2b' };
const ACCENT = '#8b1a2b';
const STACK = ['done', 'doing', 'blocked', 'todo']; // 積み上げの順(下から)
const PREV_FILL = '#c8c8c4';                        // ガントチャート・G の前の版の棒
// WBS の第 1 層の要素(根の子)。タスクが根の直下なら、そのタスク自身
const phaseOf = (n) => { let x = n; while (x.parent && x.parent.parent) x = x.parent; return x.name; };
const md = (d) => P.fmtDate(d).slice(5);
// 名前を幅に収める。添え書き(「(増えた)」など)と末端の側は残し、先頭の側を「…」で縮める(末端の名前で見分けられるように)
function clipName(key, suffix, maxW, fs = 12) {
  if (textW(key + suffix, fs) <= maxW) return key + suffix;
  const room = maxW - textW(`…${suffix}`, fs);
  const chs = [...key];
  let out = '';
  for (let k = chs.length - 1; k >= 0 && textW(chs[k] + out, fs) <= room; k--) out = chs[k] + out;
  return `…${out}${suffix}`;
}
const sumDays = (ts) => ts.reduce((a, t) => a + t.days, 0);

// ---- 推移の元の数(5.9 節)。i は比べられる版の並びの中の番号(図から選ぶときに使う)
function trendData(list) {
  const lab = labels(list), vs = list.filter((e) => e.comparable), names = vs.map((e) => lab.get(e));
  const A = vs.map((e, i) => ({ i, label: names[i], finish: e.r.sched.finishDate, end: e.r.sec.end ? e.r.sec.end.date : null }));
  // E: 同じ日付の版は、その日付の一覧で最後の版で代表させる
  const last = new Map();
  vs.forEach((e, i) => last.set(e.date, i));
  const E = [...last].map(([date, i]) => ({ i, date, label: names[i], total: sumDays(vs[i].r.tasks), done: sumDays(vs[i].r.tasks.filter((t) => t.status === 'done')) }));
  const D = vs.map((e, i) => {
    const c = { todo: 0, doing: 0, done: 0, blocked: 0 };
    for (const t of e.r.tasks) c[t.status]++;
    let mop = null;
    if (e.r.sec.FBS) { mop = { checked: 0, total: 0 }; for (const n of e.r.bySec.FBS) { mop.total += n.mops.length; mop.checked += n.mopChecked.filter(Boolean).length; } }
    return { i, label: names[i], c, total: e.r.tasks.length, mop };
  });
  // I: 隣り合う版の組ごとに、第 1 層の要素ごとの変更の件数(増えた・消えた・移動した・変わったタスク。1 つのタスクは 1 回だけ数える)
  const phases = [];
  for (const e of vs) for (const n of e.r.sec.WBS.root.children) if (!phases.includes(n.name)) phases.push(n.name);
  const pairs = [];
  for (let i = 0; i + 1 < vs.length; i++) {
    const c = compare(vs[i], vs[i + 1]);
    const cnt = new Map();
    const add = (ph) => cnt.set(ph, (cnt.get(ph) ?? 0) + 1);
    c._n.added.forEach((t) => add(phaseOf(t)));
    c._n.removed.forEach((t) => add(phaseOf(t)));
    for (const y of new Set([...c._n.moved.map((x) => x[1]), ...c._n.changed])) add(phaseOf(y));
    pairs.push({ i, from: names[i], to: names[i + 1], cnt, total: [...cnt.values()].reduce((a, b) => a + b, 0) });
  }
  // H: 担当者ごとの作成の日数。その版にいない担当者は null
  const people = [];
  for (const e of vs) for (const m of e.r.members) if (!people.includes(m.name)) people.push(m.name);
  const loads = vs.map((e) => P.peopleLoad(e.r));
  const H = people.map((name) => ({ name, vals: loads.map((l) => { const r = l.rows.find((x) => x.m.name === name); return r ? r.days : null; }) }));
  if (loads.some((l) => l.none)) H.push({ name: '(担当なし)', vals: loads.map((l) => (l.none ? l.none.days : 0)) });
  return { vs, names, A, E, D, I: { phases, pairs }, H };
}

// ---- 状態が初めて変わった版(5.11 節)
function firstChanges(list) {
  const lab = labels(list), vs = list.filter((e) => e.comparable);
  if (!vs.length) return [];
  const inv = [];
  for (let i = 0; i + 1 < vs.length; i++) inv.push(match(vs[i].r, vs[i + 1].r, 'WBS').inv);
  const lastV = vs[vs.length - 1];
  return lastV.r.tasks.map((t) => {
    const chain = [{ i: vs.length - 1, n: t }];
    for (let i = vs.length - 2; i >= 0; i--) {
      const a = inv[i].get(chain[0].n);
      if (!a || !isTask(a)) break;
      chain.unshift({ i, n: a });
    }
    const first = (st) => chain.find((x) => x.n.status === st);
    const fb = first('blocked'), fd = first('done');
    const period = !fd ? '―' : fd === chain[0] ? `〜 ${P.fmtDate(vs[fd.i].date)}` : `${P.fmtDate(vs[fd.i - 1].date)} 〜 ${P.fmtDate(vs[fd.i].date)}`;
    return [disp(t), fb ? lab.get(vs[fb.i]) : '―', fd ? lab.get(vs[fd.i]) : '―', period, P.STATUS[t.status]];
  });
}

// ---- 図の部品
const LM = 84, TOPM = 34, PLOT_H = 220, STEP = 92;
const fig = (w, h, body) => ({ kind: 'fig', w, h, body });
function niceTicks(lo, hi, want = 5, integer = false) {
  if (hi <= lo) hi = lo + 1;
  const raw = (hi - lo) / want, pw = 10 ** Math.floor(Math.log10(raw));
  let step = [1, 2, 5, 10].map((k) => k * pw).find((s) => s >= raw);
  if (integer) step = Math.max(1, Math.round(step));
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, out = [];
  for (let v = a; v <= b + step * 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}
const L = (x1, y1, x2, y2, o = {}) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.stroke ?? COL.line}" stroke-width="${o.w ?? 1}"${o.dash ? ` stroke-dasharray="${o.dash}"` : ''}/>`;
const poly = (pts, o = {}) => (pts.length > 1 ? `<polyline points="${pts.map((p) => `${p[0]},${p[1]}`).join(' ')}" fill="none" stroke="${o.stroke ?? COL.line}" stroke-width="${o.w ?? 1.6}"${o.dash ? ` stroke-dasharray="${o.dash}"` : ''}/>` : '');
// 値が null のところで線を切る
const segments = (pts) => { const out = []; let cur = []; for (const p of pts) { if (p) cur.push(p); else { if (cur.length) out.push(cur); cur = []; } } if (cur.length) out.push(cur); return out; };
// 版の目盛りの文字(2 行: 日付と「版 (2)」)。押すとその版を選ぶ(5.12 節)
function verLabel(x, y, label, i) {
  const m = /^(\S+) (.*)$/.exec(label) ?? [null, label, ''];
  return `<g data-ver="${i}">${T_(x - textW(m[1], 11) / 2, y, m[1], { fs: 11 })}${T_(x - textW(m[2], 11) / 2, y + 14, m[2], { fs: 11 })}</g>`;
}
// 縦軸の目盛りと横の補助線
function yAxis(ticks, yOf, w, fmt) {
  return ticks.map((v) => `${L(LM, yOf(v), LM + w, yOf(v), { stroke: '#e4e4e0' })}${T_(LM - 6 - textW(fmt(v), 11), yOf(v) + 4, fmt(v), { fs: 11 })}`).join('') + L(LM, TOPM, LM, TOPM + PLOT_H) + L(LM, TOPM + PLOT_H, LM + w, TOPM + PLOT_H);
}

// A. 終わりの日の推移

// E. バーンアップ: 横軸は版の日付(暦日で等間隔)

// D. タスクの数とステータスの推移

// I. 変更が多かった部分(行は WBS の第 1 層の要素、列は隣り合う版の組)
function chartI(I, cols) {

  const lw = Math.min(240, Math.max(60, textW('WBS の第 1 層', 12) + 8 /* 太字の分 */, ...rowsN.map((s) => textW(s, 12)))) + 16, hh = 40, rh = 24;

// H. 担当者ごとの作成の日数の推移

// ---- ガントチャート(5.10 節)と G(5.5 節)
function overlayData(a, b) {
  const c = compare(a, b);
  const rA = a.r, rB = b.r;
  const span = (r, t) => [r.sched.start + t.d0, r.sched.start + t.d1];
  // 棒を休みの日で切る(プロジェクト計画のガントチャートと同じ。全体の休みと、作成者の個人の休み)。続いている日は 1 本にする
  const segs = (r, t) => {
    const out = [], s0 = r.sched.start;
    for (let d = t.d0; d <= t.d1; d++) {
      if (r.isOff(s0 + d) || t.by.some((m) => r.memberOff(m, s0 + d))) continue;
      if (out.length && out[out.length - 1][1] === s0 + d - 1) out[out.length - 1][1] = s0 + d; else out.push([s0 + d, s0 + d]);
    }
    // 日数 0 のタスクは、先行が終わった時刻(t.s)の位置に細い棒(プロジェクト計画のひし形と同じ位置)。3 つ目の値が細い棒の印
    return t.days > 0 && out.length ? out : [[s0 + t.s / 1000, s0 + t.s / 1000, true]];
  };
  const rows = [
    ...c._n.pairs.map(([x, y]) => ({ key: disp(y), suffix: '', p: span(rA, x), n: span(rB, y), pS: segs(rA, x), nS: segs(rB, y), pd: x.days, nd: y.days })),
    ...c._n.added.map((t) => ({ t, key: disp(t), suffix: '(追加)', p: null, n: span(rB, t), pS: null, nS: segs(rB, t), pd: null, nd: t.days })),
  ];
  // 増えたタスクは後の版の木の順に混ぜる
  const order = new Map(rB.tasks.map((t, k) => [disp(t), k]));
  rows.sort((x, y) => order.get(x.key) - order.get(y.key));
  for (const t of c._n.removed) rows.push({ key: disp(t), suffix: '(削除)', p: span(rA, t), n: null, pS: segs(rA, t), nS: null, pd: t.days, nd: null });
  const addDays = sumDays(c._n.added), totalB = sumDays(rB.tasks);
  return {
    c, rows,
    endA: rA.sec.end ? rA.sec.end.date : null, endB: rB.sec.end ? rB.sec.end.date : null,
    est: c._n.pairs.map(([x, y]) => ({ key: disp(y), pd: x.days, nd: y.days })),
    unplanned: totalB ? Math.round((addDays / totalB) * 100) : null,
    removedDays: sumDays(c._n.removed),
    pairDays: [sumDays(c._n.pairs.map((x) => x[0])), sumDays(c._n.pairs.map((x) => x[1]))],
    people: peopleRows(rA, rB, span, segs),
    offA: (dn) => rA.isOff(dn), offB: (dn) => rB.isOff(dn),
  };
}
// J の行: 担当者ごとに、その人が作成者のタスク(複数人のタスクは全員の行)。変更後の members の順、変更後にいない人は最後。by のないタスクは「(担当なし)」
function peopleRows(rA, rB, span, segs) {
  const names = rB.members.map((m) => m.name);
  for (const m of rA.members) if (!names.includes(m.name)) names.push(m.name);
  const bars = (r, pick) => r.tasks.filter(pick).map((t) => ({ s: span(r, t), segs: segs(r, t), leaf: t.name, key: disp(t), days: t.days }));
  const rows = names.map((name) => {
    const by = (t) => t.by.some((m) => m.name === name);
    const inA = rA.members.some((m) => m.name === name), inB = rB.members.some((m) => m.name === name);
    return { name, inA, inB, p: bars(rA, by), n: bars(rB, by) };
  });
  const none = (t) => !t.by.length;
  if (rA.tasks.some(none) || rB.tasks.some(none)) rows.push({ name: '(担当なし)', inA: true, inB: true, p: bars(rA, none), n: bars(rB, none) });
  for (const r of rows) { r.pd = sumDays(r.p); r.nd = sumDays(r.n); }
  return rows;
}
// ガントチャートの休み(5.10 節): 変更後の版の全体の休みはプロジェクト計画と同じ灰の地、変更前の版だけの休みは斜線
const OFF_FILL = '#e6e6e2';
const OFF_HATCH = '<defs><pattern id="offA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><path d="M0 0V6" stroke="#cfcfcb" stroke-width="2"/></pattern></defs>';
function offBg(o, dmin, dmax, xOf, DW, y0, y1) {
  let s = '';
  for (let d = dmin; d <= dmax; d++) {
    const b = o.offB(d), a = o.offA(d);
    if (b || a) s += `<rect x="${xOf(d)}" y="${y0}" width="${DW}" height="${y1 - y0}" fill="${b ? OFF_FILL : 'url(#offA)'}"/>`;
  }
  return s ? OFF_HATCH + s : '';
}
function offLegend(o, dmin, dmax) {
  const out = [];
  let b = false, a = false;
  for (let d = dmin; d <= dmax; d++) { if (o.offB(d)) b = true; else if (o.offA(d)) a = true; }
  if (b) out.push({ text: '全体の休み(変更後)', mark: (x, y) => `<rect x="${x}" y="${y - 6}" width="12" height="12" fill="${OFF_FILL}"/>` });
  if (a) out.push({ text: '変更前だけの休み', mark: (x, y) => `${OFF_HATCH}<rect x="${x}" y="${y - 6}" width="12" height="12" fill="url(#offA)" stroke="#cfcfcb"/>` });

}
// 休みで切った棒(segs: [始めの日, 終わりの日] の並び。3 つ目の値が true なら、日数 0 のタスクの細い棒で、a はその時刻(日の単位))
// 細い棒は幅 2 で、時刻の位置を中心にする。thinAttr は細い棒の塗り(灰の棒の白い縁で見えなくならないように、縁を付けない指定を渡す)
// 変更前の細い棒は、灰の棒と見分けられるよう少し濃い灰にする

const segRects = (segs, xOf, DW, y, h, attr, thinAttr = attr) => segs.map(([a, b, thin]) => (thin

  : `<rect x="${xOf(a)}" y="${y}" width="${Math.max(2, (b - a + 1) * DW)}" height="${h}" ${attr}/>`)).join('');
// F. ガントチャートの比較
function chartF(o, a, b0, lab) {
  if (!o.rows.length) return fig(300, 24, T_(0, 16, 'タスクがありません', { fs: 12 })); // J と同じ
  const rows = o.rows.slice(a, b0);

  const dmin = Math.min(...all), dmax = Math.max(...all), days = dmax - dmin + 1;

    if (r.p) s += `<g><title>${esc(`変更前: ${P.fmtDate(r.p[0])} 〜 ${P.fmtDate(r.p[1])}`)}</title>${segRects(r.pS, xOf, DW, y + 4, 7, `fill="${PREV_FILL}"`, `fill="${THIN_PREV}"`)}</g>`;
    if (r.n) s += `<g><title>${esc(`変更後: ${P.fmtDate(r.n[0])} 〜 ${P.fmtDate(r.n[1])}`)}</title>${segRects(r.nS, xOf, DW, y + 13, 7, `fill="#fff" stroke="${COL.line}"`, `fill="${COL.line}"`)}</g>`;
  });
  const H = top + rows.length * rh;

    { text: `変更後(${lab[1]})`, mark: (x, y) => `<rect x="${x}" y="${y - 4}" width="14" height="7" fill="#fff" stroke="${COL.line}"/>` },
    { text: '期限(点線: 変更前、実線: 変更後)', mark: (x, y) => L(x, y, x + 14, y, { stroke: ACCENT, w: 1.3 }) },

// J. 担当者別ガントチャートの比較: 担当者ごとの行を上下 2 段にし、上に変更前(灰)、下に変更後(黒枠)のタスクの棒
function chartJ(o, a, b0, lab) {
  const rows = o.people.slice(a, b0);
  const all = o.people.flatMap((r) => [...r.p, ...r.n].flatMap((x) => x.s)).concat([o.endA, o.endB].filter((v) => v !== null));
  if (!o.people.some((r) => r.p.length || r.n.length)) return fig(300, 24, T_(0, 16, 'タスクがありません', { fs: 12 })); // F と同じ
  const dmin = Math.min(...all), dmax = Math.max(...all), days = dmax - dmin + 1;
  const DW = Math.max(6, Math.min(22, 900 / days));
  const dayTxt = (r) => `${P.fmtDays(r.pd)} → ${P.fmtDays(r.nd)}`;
  const nw = Math.min(200, Math.max(60, ...o.people.map((r) => textW(r.name, 12)))) + 12; // 長い名前は先頭の側を縮める
  const dw = Math.max(textW('作成の日数', 11), ...o.people.map((r) => textW(dayTxt(r), 11))) + 12;
  const lw = nw + dw, top = 46, rh = 36, W = lw + days * DW;
  const xOf = (d) => lw + (d - dmin) * DW;
  let s = offBg(o, dmin, dmax, xOf, DW, top - 4, top + rows.length * rh) + T_(4, top - 8, '担当者', { fs: 11, fill: COL.sub }) + T_(nw + 4, top - 8, '作成の日数', { fs: 11, fill: COL.sub });
  const every = Math.max(1, Math.ceil(44 / DW));
  for (let d = dmin; d <= dmax; d++) {
    if ((d - dmin) % every) continue;
    s += L(xOf(d), top - 4, xOf(d), top + rows.length * rh, { stroke: '#ececea' }) + T_(xOf(d) + 2, top - 8, md(d), { fs: 10 });
  }
  const bar = (segs, y, h, fill, stroke, title, leaf) => {
    // 灰の棒には白い縁を付け、隣り合うタスクが 1 本に見えないようにする(プロジェクト計画の担当者別ガントチャートと同じ)。休みの日で切る
    let g = `<g><title>${esc(title)}</title>${segRects(segs, xOf, DW, y, h, `fill="${fill}" stroke="${stroke ? COL.line : '#fff'}"`, stroke ? `fill="${COL.line}"` : `fill="${THIN_PREV}"`)}`;
    // 名前は、いちばん長い切れ目に入るときだけ書く
    const [a, b] = segs.reduce((m, x) => (x[1] - x[0] > m[1] - m[0] ? x : m));
    if (!segs[0][2] && textW(leaf, 10) <= (b - a + 1) * DW - 4) g += T_(xOf(a) + 2, y + h - 2, leaf, { fs: 10 });
    return `${g}</g>`;
  };
  rows.forEach((r, k) => {
    const y = top + k * rh;
    s += L(0, y + rh, W, y + rh, { stroke: '#d8d8d4' }) + T_(4, y + 22, clipName(r.name, '', nw - 10), { fs: 12 }) + `<title>${esc(r.name)}</title>` + T_(nw + 4, y + 22, dayTxt(r), { fs: 11 });
    // 日数 0 のタスクの細い棒は、隣のタスクの棒に隠れないよう最後に描く
    const zeroLast = (xs) => [...xs].sort((u, v) => (u.days === 0) - (v.days === 0));
    for (const x of zeroLast(r.p)) s += bar(x.segs, y + 4, 13, PREV_FILL, false, `変更前: ${x.key} ${P.fmtDate(x.s[0])} 〜 ${P.fmtDate(x.s[1])}`, x.leaf);
    for (const x of zeroLast(r.n)) s += bar(x.segs, y + 19, 13, '#fff', true, `変更後: ${x.key} ${P.fmtDate(x.s[0])} 〜 ${P.fmtDate(x.s[1])}`, x.leaf);
  });
  const H = top + rows.length * rh;
  if (o.endA !== null) s += L(xOf(o.endA + 1), top - 4, xOf(o.endA + 1), H, { stroke: ACCENT, dash: '4 3', w: 1.3 });
  if (o.endB !== null) s += L(xOf(o.endB + 1), top - 4, xOf(o.endB + 1), H, { stroke: ACCENT, w: 1.3 });
  const lg = legend(0, [
    { text: `変更前(${lab[0]})`, mark: (x, y) => `<rect x="${x}" y="${y - 4}" width="14" height="7" fill="${PREV_FILL}"/>` },
    { text: `変更後(${lab[1]})`, mark: (x, y) => `<rect x="${x}" y="${y - 4}" width="14" height="7" fill="#fff" stroke="${COL.line}"/>` },
    { text: '期限(点線: 変更前、実線: 変更後)', mark: (x, y) => L(x, y, x + 14, y, { stroke: ACCENT, w: 1.3 }) },
    ...offLegend(o, dmin, dmax),
  ]);
  return fig(Math.max(W, lg.w), H + 4, lg.svg + s);
}
// G. 見積もりの変化
function chartG(o, a, b0) {
  const rows = o.est.slice(a, b0);
  if (!o.est.length) return fig(300, 24, T_(0, 16, '共通のタスクがありません', { fs: 12 }));
  const lw = Math.min(380, Math.max(80, ...o.est.map((r) => textW(r.key, 12))) + 12), rh = 26;
  const maxD = Math.max(1, ...o.est.flatMap((r) => [r.pd, r.nd]));
  const px = Math.min(40, 360 / (maxD / 1000));
  const bw = (d) => Math.max(1, (d / 1000) * px);
  // 上に凡例(灰 = 変更前、黒枠 = 変更後)。図だけを保存しても棒の意味がわかるように
  const top = 26;
  let s = legend(lw, [
    { text: '変更前', mark: (x, y) => `<rect x="${x}" y="${y - 4}" width="14" height="8" fill="${PREV_FILL}"/>` },
    { text: '変更後', mark: (x, y) => `<rect x="${x}" y="${y - 4}" width="14" height="8" fill="#fff" stroke="${COL.line}"/>` },
  ]).svg;
  rows.forEach((r, k) => {
    const y = top + k * rh, d = r.nd - r.pd;
    const nm = clipName(r.key, '', lw - 10);
    s += T_(4, y + 17, nm, { fs: 12 }) + `<title>${esc(r.key)}</title>`;
    s += `<rect x="${lw}" y="${y + 4}" width="${bw(r.pd)}" height="8" fill="${PREV_FILL}"><title>${esc(`変更前: ${P.fmtDays(r.pd)} 日`)}</title></rect>`;
    s += `<rect x="${lw}" y="${y + 13}" width="${bw(r.nd)}" height="8" fill="#fff" stroke="${COL.line}"><title>${esc(`変更後: ${P.fmtDays(r.nd)} 日`)}</title></rect>`;
    const t = `${P.fmtDays(r.pd)} → ${P.fmtDays(r.nd)}(${d > 0 ? `+${P.fmtDays(d)}` : d < 0 ? `-${P.fmtDays(-d)}` : '±0'})`;
    s += T_(lw + bw(Math.max(r.pd, r.nd)) + 6, y + 17, t, { fs: 11, weight: d ? '600' : null });
  });
  return fig(Math.max(lw + bw(maxD) + 150, lw + 140), top + rows.length * rh + 4, s);
}

// ---- ビューの部品(推移・日程・ガントチャート)。chart: 印刷で区切るための描き直しの関数と、区切る単位の数
function trendBlocks(list, blocks, tables) {
  const t = trendData(list);
  blocks.push(txt('推移', { fs: 15, weight: '600' }));
  if (!t.vs.length) return { message: '比較できる版がありません(エラーがなく version: のある .plan が必要です)' };
  const n = t.vs.length;
  // 図ごとに保存できるよう、図に題と識別子(ファイル名に使う)を付けておく(7.3 節・7.4 節)
  const add = (id, title, chart) => { blocks.push({ kind: 'gap', h: 6 }); const tb = txt(title, { fs: 13, weight: '600' }); tb.anchor = { kind: 'fig', id }; blocks.push(tb); const f = chart.draw(0, chart.n); f.chart = chart; f.fig = { id, title, pre: [tb] }; blocks.push(f); };
  add('end', '終了日の推移', { n, draw: (a, b) => chartA(t.A.slice(a, b)) });
  add('burnup', 'バーンアップ(横軸は版の日付)', { n: t.E.length, draw: (a, b) => chartE(t.E.slice(a, b)) });
  add('status', 'タスク数と進捗の推移', { n, draw: (a, b) => chartD(t.D.slice(a, b)) });
  if (t.I.pairs.length) add('changes', '変更の多い部分(WBS の第 1 層ごとのタスクの変更数)', { n: t.I.pairs.length, draw: (a, b) => chartI(t.I, t.I.pairs.slice(a, b)) });
  else { blocks.push({ kind: 'gap', h: 6 }); blocks.push(txt('変更の多い部分: 2 つ以上の版が必要です', { fs: 13 })); }
  add('effort', '担当者ごとの作成の日数', { n, draw: (a, b) => chartH(t.H, t.names, a, b) });
  blocks.push({ kind: 'gap', h: 10 });
  const fc = firstChanges(list);
  section(blocks, tables, 'タスクの進捗が初めて変わった版', ['タスク', '問題発生', '完了', '完了の時期', '現在の進捗'], fc);
  return {};
}
function overlayBlocks(pair, lab, blocks, tables) {
  const o = overlayData(pair[0], pair[1]);
  const names = [lab.get(pair[0]), lab.get(pair[1])];
  blocks.push({ kind: 'gap', h: 6 });
  const tF = txt('ガントチャートの比較', { fs: 15, weight: '600' });
  tF.anchor = { kind: 'fig', id: 'gantt' };
  blocks.push(tF);
  const fF = chartF(o, 0, o.rows.length, names); fF.chart = { n: o.rows.length, draw: (a, b) => chartF(o, a, b, names), rows: true };
  fF.fig = { id: 'gantt', title: 'ガントチャートの比較', pre: [txt(`比較: ${names[0]}(${pair[0].name}) → ${names[1]}(${pair[1].name})`, { fs: 13, weight: '600' }), tF] };
  blocks.push(fF);
  blocks.push({ kind: 'gap', h: 10 });
  const tJ = txt('担当者別ガントチャートの比較', { fs: 15, weight: '600' });
  tJ.anchor = { kind: 'fig', id: 'gantt-people' };
  blocks.push(tJ);
  const fJ = chartJ(o, 0, o.people.length, names); fJ.chart = { n: o.people.length, draw: (a, b) => chartJ(o, a, b, names), rows: true };
  fJ.fig = { id: 'gantt-people', title: '担当者別ガントチャートの比較', pre: [fF.fig.pre[0], tJ] };
  blocks.push(fJ);
}

// 日程のビューの見積もりの変化(5.5 節の後)
function estimateBlocks(pair, lab, blocks) {
  const o = overlayData(pair[0], pair[1]);
  const names = [lab.get(pair[0]), lab.get(pair[1])];
  const head = txt(`比較: ${names[0]}(${pair[0].name}) → ${names[1]}(${pair[1].name})`, { fs: 13, weight: '600' });
  blocks.push({ kind: 'gap', h: 10 });
  const tG = txt('見積もりの変化', { fs: 15, weight: '600' });
  tG.anchor = { kind: 'fig', id: 'estimate' };
  blocks.push(tG);
  const tN = txt(`計画外のタスク: ${o.unplanned === null ? '―' : `${o.unplanned}%`}(追加したタスクの日数 ÷ 変更後の総日数) / 削除したタスク: ${P.fmtDays(o.removedDays)} 日 / 共通のタスク: ${P.fmtDays(o.pairDays[0])} → ${P.fmtDays(o.pairDays[1])} 日`, { fs: 12 });
  blocks.push(tN);
  const fG = chartG(o, 0, o.est.length); fG.chart = { n: o.est.length, draw: (a, b) => chartG(o, a, b), rows: true, page: true };
  fG.fig = { id: 'estimate', title: '見積もりの変化', pre: [head, tG, tN] };
  blocks.push(fG);
}

// ---- 改訂履歴(5.13 節): すべての版の改訂の履歴。1 つの変更を 1 行にする
function revisionHistory(list) {
  const lab = labels(list), vs = list.filter((e) => e.comparable);
  const rows = [];
  const fd = (d) => (d === null ? '―' : P.fmtDate(d));
  vs.forEach((e, i) => {
    // 種類は「対象」と「操作」の 2 列にする(5.13 節)
    const push = (target, op, content) => rows.push({ cells: [lab.get(e), e.name, target, op, content], group: i, ver: i });
    if (i === 0) { push('―', '初版', `タスク ${e.r.tasks.length} 件、終了日 ${fd(e.r.sched.finishDate)}`); return; }
    const c = compare(vs[i - 1], e);
    const n0 = rows.length;
    c.tasks.added.forEach((r) => push('タスク', '追加', r[0]));
    c.tasks.removed.forEach((r) => push('タスク', '削除', r[0]));
    c.tasks.moved.forEach((x) => push('タスク', '移動', `${x.key}(親: ${x.from} → ${x.to})`));
    c.tasks.changed.forEach((x) => push('タスク', '変更', `${x.key}(${x.items.map((it) => `${it[0]} ${it[1]} → ${it[2]}`).join('、')})`));
    c.tasks.status.forEach((x) => push('タスクの進捗', '変更', `${x.key}(${x.from} → ${x.to})`));
    for (const [k, t] of [['FBS', c.fbs], ['PBS', c.pbs]]) {
      const withMop = (x) => (k === 'FBS' && x[1] !== 'なし' ? `${x[0]}(MOP: ${x[1]})` : x[0]);
      t.added.forEach((x) => push(`${k} 要素`, '追加', withMop(x)));
      t.removed.forEach((x) => push(`${k} 要素`, '削除', withMop(x)));
      t.moved.forEach((x) => push(`${k} 要素`, '移動', `${x.key}(親: ${x.from} → ${x.to})`));
    }
    for (const [op, arr] of [['追加', c.mop.added], ['削除', c.mop.removed], ['確認', c.mop.checked], ['確認取り消し', c.mop.unchecked]]) arr.forEach((x) => push('MOP', op, `${x[0]}: ${x[1]}`));
    c.roots.forEach((x) => push(`${x.sec} の根の名前`, '変更', `${x.from} → ${x.to}`));
    // 開始日・期限・全体の休み(概要の表と同じ値で比べる)
    const pr = vs[i - 1].r;
    const startOf = (r) => P.fmtDate(r.sec.start.date), endOf = (r) => (r.sec.end ? P.fmtDate(r.sec.end.date) : 'なし'), offOf = (r) => offText(r) || 'なし';
    const same = (target, x, y) => (target === '全体の休み' ? offKey(x === 'なし' ? '' : x) === offKey(y === 'なし' ? '' : y) : x === y);
    for (const [target, f] of [['開始日', startOf], ['期限', endOf], ['全体の休み', offOf]]) if (!same(target, f(pr), f(e.r))) push(target, '変更', `${f(pr)} → ${f(e.r)}`);
    c.people.added.forEach((x) => push('メンバー', '追加', x));
    c.people.removed.forEach((x) => push('メンバー', '削除', x));
    c.people.off.forEach((x) => push('メンバーの休み', '変更', `${x.name}(${x.a} → ${x.b})`));
    const a = vs[i - 1].r.sched.finishDate, b = e.r.sched.finishDate;
    if (a !== b) push('終了日', '変更', `${fd(a)} → ${fd(b)}${a !== null && b !== null ? `(${b - a > 0 ? '+' : ''}${b - a})` : ''}`);
    if (rows.length === n0) push('―', '変更なし', '変更はありません');
  });
  const errs = list.filter((e) => e.nErr), nover = list.filter((e) => !e.nErr && e.date === null);
  return { rows, errs, nover };
}
function historyBlocks(list, blocks, tables) {
  const h = revisionHistory(list);
  const th = txt('改訂履歴', { fs: 15, weight: '600' });
  blocks.push(th);
  if (h.errs.length) blocks.push(txt(`エラーのため除外: ${h.errs.map((e) => e.name).join('、')}`, { fs: 13, fill: ACCENT, weight: '600' }));
  if (h.nover.length) blocks.push(txt(`version: がないため除外: ${h.nover.map((e) => e.name).join('、')}`, { fs: 13, fill: ACCENT, weight: '600' }));
  if (!h.rows.length) return { message: '比較できる版がありません(エラーがなく version: のある .plan が必要です)' };
  const tbl = { title: '改訂履歴', header: ['版', 'ファイル', '対象', '操作', '内容'], rows: h.rows, merge: 2, maxw: { 4: 560 } };
  th.anchor = { kind: 'table', ref: tbl };
  blocks.push({ kind: 'table', tbl });
  tables.push(tbl);
  return {};
}

const VIEWS = [
  // all: すべての版を示すビュー(比較する版の帯を出さない)
  { id: 'overview', label: '概要', all: true },
  { id: 'history', label: '改訂履歴', all: true },
  { id: 'trend', label: '推移', all: true },
  { id: 'tasks', label: 'WBS' },
  { id: 'sched', label: '日程' },
  { id: 'fbs', label: 'FBS・PBS・MOP' },
  { id: 'people', label: 'メンバー' },
  { id: 'gantt', label: 'ガントチャート' },
];
// 比較の要約(仕様書 5.3 節)
function summaryBlocks(c, lab, blocks, tables) {
  blocks.push(txt(`比較: ${lab.get(c.a)}(${c.a.name}) → ${lab.get(c.b)}(${c.b.name})`, { fs: 13, weight: '600' }));
  for (const x of c.roots) blocks.push(txt(`${x.sec} の根の名前を変更: ${x.from} → ${x.to}`, { fs: 13 }));
  section(blocks, tables, '対応した要素', ['節', '対応数 / 要素数'], c.counts.map((x) => [x.sec, `${x.matched} / ${x.total}`]), { noCount: true });
}
// ビューを作る。戻り値 { blocks, tables, message }
function build(list, view, pair) {
  const blocks = [], tables = [];
  const lab = labels(list);
  if (view === 'overview') {
    const o = overview(list);
    const to = txt('概要', { fs: 15, weight: '600' });
    blocks.push(to);
    if (!o.cols.length) return { blocks, tables, message: '比較できる版がありません(エラーがなく version: のある .plan が必要です)' };
    const tbl = {
      title: '概要', header: ['項目', ...o.cols.map((e) => lab.get(e))],
      // ファイル名は版ごとに違うのが普通なので、太字にしない
      rows: o.rows.slice(1).map((r) => ({ cells: [r.name, ...r.values.map((v, i) => (r.name !== 'ファイル' && i > 0 && (r.name === '全体の休み' ? offKey(v === '―' ? '' : v) !== offKey(r.values[i - 1] === '―' ? '' : r.values[i - 1]) : v !== r.values[i - 1]) ? { t: v, bold: true } : v))] })),
    };
    to.anchor = { kind: 'table', ref: tbl };
    blocks.push({ kind: 'table', tbl, overview: true });
    tables.push(tbl);
    blocks.push(txt('太字: 左の版から変わった値', { fs: 11, fill: COL.sub }));
    return { blocks, tables };
  }
  if (view === 'trend') { const r = trendBlocks(list, blocks, tables); return { blocks, tables, message: r.message }; }
  if (view === 'history') { const r = historyBlocks(list, blocks, tables); return { blocks, tables, message: r.message }; }
  if (!pair) return { blocks, tables, message: '比較には 2 つ以上の版が必要です' };
  const c = compare(pair[0], pair[1]);
  summaryBlocks(c, lab, blocks, tables);
  if (view === 'tasks') {
    heading(blocks, 'WBS');
    section(blocks, tables, '追加したタスク', ['タスク', '日数', '作成者', '確認者'], c.tasks.added);
    section(blocks, tables, '削除したタスク', ['タスク', '日数', '作成者', '確認者'], c.tasks.removed);
    section(blocks, tables, '移動したタスク', ['タスク', '前の親', '後の親'], c.tasks.moved.map((x) => [x.key, x.from, x.to]));
    const rows = [];
    c.tasks.changed.forEach((x, i) => x.items.forEach((it) => rows.push({ cells: [x.key, ...it], group: i })));
    if (!rows.length) blocks.push(txt('変更したタスク: なし', { fs: 13 }));
    else {
      const tc = txt(`変更したタスク(${c.tasks.changed.length} 件)`, { fs: 13, weight: '600' });
      blocks.push(tc);
      const tbl = { title: '変更したタスク', header: ['タスク', '項目', '変更前', '変更後'], rows };
      tc.anchor = { kind: 'table', ref: tbl };
      blocks.push({ kind: 'table', tbl }); tables.push(tbl);
    }
    section(blocks, tables, '進捗が変わったタスク', ['タスク', '変更前', '変更後'], c.tasks.status.map((x) => [x.key, x.from, x.to]));
  } else if (view === 'sched') {
    heading(blocks, '日程(各版のテキストから計算した終了日)');
    const sg = (d) => (d > 0 ? `+${d}` : String(d));
    if (c.sched.worst.length) section(blocks, tables, '最も遅れたタスク', ['タスク', '差(日)'], c.sched.worst.map((s) => [s.key, sg(s.diff)]));
    else blocks.push(txt('遅れたタスクはありません', { fs: 13 }));
    section(blocks, tables, 'タスクごとの終了日', ['タスク', '変更前', '変更後', '差(日)'], c.sched.rows.map((s) => [s.key, s.a, s.b, sg(s.diff)]));
    estimateBlocks(pair, lab, blocks);
  } else if (view === 'fbs') {
    for (const [k, t] of [['FBS', c.fbs], ['PBS', c.pbs]]) {
      if (!t.show) continue;
      heading(blocks, k);
      // FBS は要素の行に MOP を含めて示す(仕様書 4.6 節)
      const cols = k === 'FBS' ? ['要素', 'MOP'] : ['要素'];
      const rowOf = (x) => (k === 'FBS' ? x : [x[0]]);
      section(blocks, tables, `${k}: 追加した要素`, cols, t.added.map(rowOf));
      section(blocks, tables, `${k}: 削除した要素`, cols, t.removed.map(rowOf));
      section(blocks, tables, `${k}: 移動した要素`, ['要素', '前の親', '後の親'], t.moved.map((x) => [x.key, x.from, x.to]));
    }
    if (c.mop.show) {
      heading(blocks, 'MOP');
      section(blocks, tables, '追加した MOP', ['FBS の要素', 'MOP'], c.mop.added);
      section(blocks, tables, '削除した MOP', ['FBS の要素', 'MOP'], c.mop.removed);
      section(blocks, tables, '確認した MOP', ['FBS の要素', 'MOP'], c.mop.checked);
      section(blocks, tables, '確認を取り消した MOP', ['FBS の要素', 'MOP'], c.mop.unchecked);
    }
    if (!c.fbs.show && !c.pbs.show) blocks.push(txt('どちらの版にも FBS・PBS がありません', { fs: 13 }));
  } else if (view === 'gantt') {
    overlayBlocks(pair, lab, blocks, tables);
  } else if (view === 'people') {
    heading(blocks, 'メンバー');
    section(blocks, tables, '追加したメンバー', ['メンバー'], c.people.added.map((x) => [x]));
