      rows: rows.map((x) => { const a = anc(x.n); return [...Array.from({ length: LV }, (_, k) => (a[k] ? a[k].name : '')), label(x.n), x.i >= 0 && x.n.mopChecked[x.i] ? '✓' : '', x.i < 0 ? '(MOP なし)' : x.n.mops[x.i], ...(hasP ? [pbsName(x.n)] : [])]; }),
      frag: out.join(''), box: [x0, HY, endX - x0, ry[ry.length - 1] - HY] });
  }
  const sub = `チェック済み ${done0} / ${total0} 件。済の欄をクリックすると、mop:(未チェック)と mop*:(チェック済み)が切り替わる${warned.size ? '。点線の黄色い枠は MOP がない要素(検査 C3)' : ''}`;
  const W = Math.max(endX + M, textW(sub, 11) + 2 * M, textW(`テスト項目(MOP): ${root.name}`, 13) + 2 * M);
  return wrapSvg(W, ry[ry.length - 1] + M, title + T_(M, 42, sub, { fs: 11, fill: COL.sub }) + out.join(''));
}

// ---- 役割分担(仕様書 7.4 節)
// opt.rows: タスクの表の範囲 [始め, 終わり)。opt.table === false ならタスクの表を描かない。opt.sum === false なら担当者ごとのまとめを描かない(印刷でページを分けるとき)
function renderRoles(r, opt = {}) {
  const M = 20, TOP = 46;
  if (!r.tasks.length) return wrapSvg(400, 80, T_(M, 40, 'WBS にタスクがありません', { fs: 13 }));
  const L = wbsTable(r);
  const pw = (list) => Math.min(200, Math.max(70, ...r.tasks.map((t) => textW(list(t), L.FS) + 12)));
  const byW = pw((t) => who(r, t.by)), rvW = pw((t) => who(r, t.review));
  const extra = [['作成者', byW], ['確認者', rvW], ['日数', 50]];
  const hc = headerCells(L, M, TOP, L.RH, extra);
  const table = opt.table !== false;
  const nRows = opt.rows ? opt.rows[1] - opt.rows[0] : r.tasks.length;
  const body = table ? drawWbsLeft(r, L, M, TOP + L.RH, (t) => [[byW, who(r, t.by) || '(なし)'], [rvW, who(r, t.review)], [50, fmtDays(t.days)]], { rows: opt.rows }) : '';
  const tableW = hc.x - M;
  if (opt.collect && table) {
    const anc = (t) => { const a = []; for (let x = t.parent; x && x.parent; x = x.parent) a.unshift(x); return a; };
    opt.collect.anchors.push({ kind: 'table', index: opt.collect.tables.length, label: `役割分担: ${r.sec.WBS.root.name}`, y: 28, fs: 13 });
    opt.collect.tables.push({ name: '役割分担', header: [...Array.from({ length: L.levels }, (_, k) => `第 ${k + 1} 層`), 'タスク', '作成者', '確認者', '日数'],
      rows: r.tasks.map((t) => { const a = anc(t); return [...Array.from({ length: L.levels }, (_, k) => (a[k] ? `${a[k].num} ${a[k].name}` : '')), `${t.num} ${t.name}`, who(r, t.by) || '(なし)', who(r, t.review), fmtDays(t.days)]; }),
      frag: hc.svg + body, box: [M, TOP, tableW, L.RH * (nRows + 1)] });
  }
  // 担当者ごとのまとめ
  let y = table ? TOP + L.RH * (nRows + 1) + 30 : TOP + 22;
  const sum = [];
  const titleW = textW(`役割分担: ${r.sec.WBS.root.name}`, 13); // 題が図の幅に収まるように
  if (opt.sum === false) return wrapSvg(Math.max(tableW, 450, titleW) + 2 * M, y - 30 + M, T_(M, 28, `役割分担: ${r.sec.WBS.root.name}`, { fs: 13, weight: '600' }) + hc.svg + body);
  sum.push(T_(M, y - 8, '担当者ごとのまとめ', { fs: 13, weight: '600' }));
  const cols = [['担当者', 120], ['作成するタスク', 100], ['作成の日数の合計', 130], ['確認するタスク', 100]];
  const sum0 = sum.length, sy0 = y, sumRows = [];
  let x = M;
  for (const [h, w] of cols) { sum.push(`<rect x="${x}" y="${y}" width="${w}" height="${L.RH}" fill="${COL.head}" stroke="${COL.grid}"/>` + T_(x + 5, y + 15, h, { fs: L.FS, weight: '600' })); x += w; }
  y += L.RH;
  for (const m of r.members) {
    const mk = r.tasks.filter((t) => t.by.includes(m)), rv = r.tasks.filter((t) => t.review.includes(m));
    const vals = [m.name, `${mk.length} 件`, `${fmtDays(mk.reduce((a, t) => a + t.days, 0))} 日`, `${rv.length} 件`];
    sumRows.push(vals);
    x = M;
    let row = '';
    vals.forEach((v, i) => { row += `<rect x="${x}" y="${y}" width="${cols[i][1]}" height="${L.RH}" fill="#fff" stroke="${COL.grid}"/>` + T_(x + 5, y + 15, clip(v, cols[i][1] - 10, L.FS), { fs: L.FS }); x += cols[i][1]; });
    sum.push(`<g data-id="m${r.members.indexOf(m)}" data-start="${m.start}" data-end="${m.end}">${row}</g>`);
    y += L.RH;
  }
  if (opt.collect) {
    opt.collect.anchors.push({ kind: 'table', index: opt.collect.tables.length, label: '担当者ごとのまとめ', y: sy0 - 8, fs: 13 });
    opt.collect.tables.push({ name: '担当者ごとのまとめ', header: cols.map((c) => c[0]), rows: sumRows, frag: sum.slice(sum0).join(''), box: [M, sy0, cols.reduce((a, c) => a + c[1], 0), y - sy0] });
  }
  const W = Math.max(tableW, 450, titleW) + 2 * M;
  return wrapSvg(W, y + M, T_(M, 28, `役割分担: ${r.sec.WBS.root.name}`, { fs: 13, weight: '600' }) + (table ? hc.svg + body : '') + sum.join(''));
}

// ---- ガントチャート(仕様書 7.5 節)
// 状態の塗り(仕様書 7.5 節)。実行前は白地に黒枠、完了は目立たない灰、問題発生だけを強調の色にする
const STATUS_FILL = { todo: '#fff', doing: COL.blue, done: '#bdbdb8', blocked: COL.accent };
const statusAttr = (st) => `fill="${STATUS_FILL[st]}"${st === 'todo' ? ` stroke="${COL.line}" stroke-width="1"` : ''}`;
// 遅延: 今日より前の日に終わる予定で、完了になっていないタスク(today は 1970-01-01 からの日数)
const isLate = (r, t, today) => today !== null && t.status !== 'done' && today > r.sched.start + t.d1;
// ---- ガントチャートと担当者別ガントチャートで共通の部品
// 日付の目盛り(月・日・曜日の 3 段)と、本体の日の列(全体の休みは灰色)
function timeGrid(r, gx, TOP, HR, nDays, DW, bodyY, bodyH) {
  const s0 = r.sched.start, out = [];
  let mStart = 0;
  for (let d = 0; d <= nDays; d++) {
    const p = d < nDays ? dateParts(s0 + d) : null;
    if (d === nDays || (d > 0 && p.d === 1)) {
      const pp = dateParts(s0 + mStart);
      out.push(`<rect x="${gx + mStart * DW}" y="${TOP}" width="${(d - mStart) * DW}" height="${HR}" fill="${COL.head}" stroke="${COL.grid}"/>` + T_(gx + mStart * DW + 4, TOP + 15, `${pp.y}年${pp.m}月`, { fs: 11 }));
      mStart = d;
    }
  }
  for (let d = 0; d < nDays; d++) {
    const dn = s0 + d, p = dateParts(dn), x = gx + d * DW;
    const off = r.isOff(dn);
    out.push(`<rect x="${x}" y="${TOP + HR}" width="${DW}" height="${HR}" fill="${off ? COL.off : COL.head}" stroke="${COL.grid}"/>` + T_(x + DW / 2, TOP + HR + 15, String(p.d), { fs: 11, anchor: 'middle' }));
    out.push(`<rect x="${x}" y="${TOP + 2 * HR}" width="${DW}" height="${HR}" fill="${off ? COL.off : COL.head}" stroke="${COL.grid}"/>` + T_(x + DW / 2, TOP + 2 * HR + 15, WD_JA[p.w], { fs: 11, anchor: 'middle', fill: p.w === 0 ? '#b00020' : p.w === 6 ? '#1d4ed8' : COL.text }));
    out.push(`<rect x="${x}" y="${bodyY}" width="${DW}" height="${bodyH}" fill="${off ? COL.off : '#fff'}" stroke="${COL.grid}" stroke-width=".6"/>`);
  }
  return out;
}
const HATCH = '<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><path d="M0 0V6" stroke="#bbb" stroke-width="2"/></pattern></defs>';
// タスクの棒(休みの日で切り、続いている日は 1 本にする。日数 0 はひし形)
function barSvg(r, t, gx, DW, y, h, fill) {
  const s0 = r.sched.start;
  if (t.f === t.s) return `<path d="M${gx + t.s / 1000 * DW} ${y}l${h / 2} ${h / 2}l${-h / 2} ${h / 2}l${-h / 2} ${-h / 2}Z" ${fill}/>`;
  const segs = [];
  for (let d = t.d0; d <= t.d1; d++) {
    if (r.isOff(s0 + d) || t.by.some((m) => r.memberOff(m, s0 + d))) continue;
    const a = Math.max(t.s, d * 1000), b = Math.min(t.f, (d + 1) * 1000);
    if (b <= a) continue;
    if (segs.length && segs[segs.length - 1][1] === a) segs[segs.length - 1][1] = b; else segs.push([a, b]);
  }
  return segs.map(([a, b]) => `<rect x="${gx + a / 1000 * DW}" y="${y}" width="${(b - a) / 1000 * DW}" height="${h}" ${fill}/>`).join('');
}
// end: の線と今日の線
function markLines(r, gx, TOP, HR, nDays, DW, bottom, endD, today) {
  const s0 = r.sched.start, out = [];
  if (endD) {
    const x = gx + endD * DW;
    out.push(`<path d="M${x} ${TOP + HR}V${bottom + 6}" stroke="${COL.accent}" stroke-width="2" stroke-dasharray="6 3"/>` + T_(x + 3, bottom + 18, 'end', { fs: 11, fill: COL.accent }));
  }
  // 今日の線(今日の列の始まり。これより左で終わる棒が、完了でなければ遅延)
  if (today !== null && today >= s0 && today < s0 + nDays) {
    const x = gx + (today - s0) * DW;
    out.push(`<path d="M${x} ${TOP + HR}V${bottom + 6}" stroke="${COL.line}" stroke-width="2"/>` + T_(x - 3, bottom + 18, '今日', { fs: 11, anchor: 'end', fill: COL.line, weight: '600' }));
  }
  return out;
}
// 凡例: 進捗の塗り、遅延、休み
// twoLines: 説明の文を 2 行目に回す(担当者別ガントチャート。図の幅が説明の文で広がりすぎないように)
function legendSvg(today, M, extra = '', lateMark = false, twoLines = false) {
  const lg = [];
  let lx = M;
  for (const k of Object.keys(STATUS)) {
    lg.push(`<rect x="${lx}" y="35" width="18" height="11" ${statusAttr(k)}/>` + T_(lx + 22, 45, STATUS[k], { fs: 11 }));
    lx += 22 + textW(STATUS[k], 11) + 14;
  }
  if (today !== null && lateMark) { lg.push(`<circle cx="${lx + 5}" cy="41" r="4" fill="${COL.accent}"/>`); lx += 12; }
  if (today !== null) { lg.push(T_(lx, 45, '遅延', { fs: 11, fill: COL.accent, weight: '600' })); lx += textW('遅延', 11); }
  const lateDef = today !== null ? `: 今日(${fmtDate(today)})より前に終わる予定で、完了になっていないタスク。` : '';
  const rest = `${twoLines ? '' : lateDef}灰色の列は全体の休み、斜線は担当者の休み。棒は休みの日を除いて描く${extra}`;
  if (!twoLines) { lg.push(T_(lx, 45, rest, { fs: 11, fill: COL.sub })); return { svg: lg.join(''), w: lx + textW(rest, 11) }; }
  if (lateDef) lg.push(T_(lx, 45, lateDef.replace(/。$/, ''), { fs: 11, fill: COL.sub }));
  const lines = ['灰色の列は全体の休み、斜線は担当者の休み。棒は休みの日を除いて描く。', ...extra.split('。').filter(Boolean).map((x) => `${x}。`)];
  lines.forEach((l, i) => lg.push(T_(M, 61 + i * 15, l, { fs: 11, fill: COL.sub })));
  return { svg: lg.join(''), w: Math.max(lx + textW(lateDef, 11), ...lines.map((l) => M + textW(l, 11))), h: 61 + (lines.length - 1) * 15 };
}
const lateText = (t, gx, DW, y, h) => T_(gx + t.f / 1000 * DW + (t.f === t.s ? h / 2 : 0) + 5, y + h / 2 + 4, '遅延', { fs: 11, fill: COL.accent, weight: '600' });
const barTitle = (r, t, late) => `${t.num} ${t.name}: ${fmtDate(r.sched.start + t.d0)} 〜 ${fmtDate(r.sched.start + t.d1)}(${fmtDays(t.days)} 日)、${STATUS[t.status]}${late ? '、遅延' : ''}`;
// 図の日数(終了日と end: の遅い方まで)
const figDays = (r) => { const endD = r.sec.end && r.sec.end.date !== null ? r.sec.end.date - r.sched.start + 1 : 0; return { endD, nDays: Math.max(r.sched.spanDays, endD, 1) }; };

// opts.rows: 描くタスクの範囲 [始め, 終わり)(印刷で行を区切るとき)
function renderGantt(r, opts = {}) {
  const M = 20, TOP = 58;
  if (!r.tasks.length) return wrapSvg(400, 80, T_(M, 40, 'WBS にタスクがありません', { fs: 13 }));
  const L = wbsTable(r);
  const byW = Math.min(160, Math.max(60, ...r.tasks.map((t) => textW(who(r, t.by), L.FS) + 12)));
  const DW = 24, HR = L.RH; // 1 日の幅、見出しの 1 段の高さ
  const s0 = r.sched.start;
  const { endD, nDays } = figDays(r);
  const today = opts.today ? parseDate(opts.today) : null;
  const stW = 64;
  const left = headerCells(L, M, TOP, HR * 3, [['作成者', byW], ['進捗', stW]]);
  const gx = left.x;
  const T = opts.rows ? r.tasks.slice(opts.rows[0], opts.rows[1]) : r.tasks;
  const bodyY = TOP + HR * 3, n = T.length;
  const out = [left.svg, ...timeGrid(r, gx, TOP, HR, nDays, DW, bodyY, n * L.RH)];
  for (let i = 0; i <= n; i++) out.push(`<path d="M${gx} ${bodyY + i * L.RH}H${gx + nDays * DW}" stroke="${COL.grid}" stroke-width=".6"/>`);
  // 担当者の個人の休み(タスクの行に薄い斜線)
  T.forEach((t, i) => {
    for (let d = 0; d < nDays; d++) {
      if (r.isOff(s0 + d)) continue;
      if (t.by.some((m) => r.memberOff(m, s0 + d))) out.push(`<rect x="${gx + d * DW + .5}" y="${bodyY + i * L.RH + .5}" width="${DW - 1}" height="${L.RH - 1}" fill="url(#hatch)"/>`);
    }
  });
  // 棒
  const handles = [];
  T.forEach((t, i) => {
    const y = bodyY + i * L.RH + 4, h = L.RH - 8;
    let s = barSvg(r, t, gx, DW, y, h, statusAttr(t.status));
    const late = isLate(r, t, today);
    if (late) s += lateText(t, gx, DW, y, h);
    out.push(`<g ${sel(t)}><title>${esc(barTitle(r, t, late))}</title>${s}</g>`);
    if (t.days > 0) handles.push(`<rect data-handle="${t.id}" data-days="${t.days}" data-dw="${DW}" data-gx="${gx}" x="${gx + t.f / 1000 * DW - 4}" y="${y - 1}" width="8" height="${h + 2}" fill="transparent"><title>ドラッグで日数を変える</title></rect>`);
  });
  out.push(...markLines(r, gx, TOP, HR, nDays, DW, bodyY + n * L.RH, endD, today));
  out.push(...handles);
  const body = drawWbsLeft(r, L, M, bodyY, (t) => [[byW, who(r, t.by)], [stW, STATUS[t.status], t.status === 'blocked' ? COL.accent : undefined]], { crit: false, rows: opts.rows });
  const head = summaryText(r);
  const lg = legendSvg(today, M);
  const W = gx + nDays * DW + M + 30;
  return wrapSvg(Math.max(W, textW(head[0], 13) + 2 * M, lg.w + M), bodyY + n * L.RH + 30 + M, HATCH + T_(M, 24, head[0], { fs: 13, weight: '600' })
    + lg.svg + out.join('') + body);
}

// ---- 担当者別ガントチャート(仕様書 7.7 節)
// 担当者 1 人につき 1 行。その人が作成者(by:)のタスクの棒を日程どおりに並べる。左に作成の日数・稼働率・確認の件数
function peopleLoad(r) {
  const s0 = r.sched.start, { nDays } = figDays(r);
  const rows = r.members.map((m, i) => {
    const tasks = r.tasks.filter((t) => t.by.includes(m));
    let cap = 0;
    for (let d = 0; d < nDays; d++) if (!r.isOff(s0 + d) && !r.memberOff(m, s0 + d)) cap++;
    const days = tasks.reduce((a, t) => a + t.days, 0);
    return { m, i, tasks, days, cap, rate: cap ? days / (cap * 1000) : null, review: r.tasks.filter((t) => t.review.includes(m)).length };
  });
  const none = r.tasks.filter((t) => !t.by.length);
  return { rows, none: none.length ? { tasks: none, days: none.reduce((a, t) => a + t.days, 0) } : null, nDays };
}
// opts.rows: 描く行の範囲 [始め, 終わり)(印刷で行を区切るとき。横棒の長さの基準は全体のまま)
function renderPeople(r, opts = {}) {
  const M = 20, TOP = 108, FS = 12, RH = 26, HR = 22, DW = 24;
  if (!r.tasks.length) return wrapSvg(400, 80, T_(M, 40, 'WBS にタスクがありません', { fs: 13 }));
  const today = opts.today ? parseDate(opts.today) : null;
  const s0 = r.sched.start, { endD } = figDays(r);
  const ld = peopleLoad(r), nDays = ld.nDays;
  // 並び: 書いた順(既定)。作成の日数か稼働率で、少ない順・多い順に並べ替えられる(表示だけ。同じなら書いた順)
  const sort = opts.sort && ['days', 'rate'].includes(opts.sort.key) && ['asc', 'desc'].includes(opts.sort.dir) ? opts.sort : null;
  const rows = [...ld.rows];
  if (sort) {
    const v = (x) => (sort.key === 'days' ? x.days : x.rate ?? -1);
    rows.sort((a, b) => (sort.dir === 'asc' ? v(a) - v(b) : v(b) - v(a)) || a.i - b.i);
  }
  const all = rows.map((x) => ({ name: x.m.name, member: x.m, i: x.i, tasks: x.tasks, days: x.days, rate: x.rate, review: x.review }));
  if (ld.none) all.push({ name: '(担当なし)', member: null, tasks: ld.none.tasks, days: ld.none.days, rate: null, review: null });
  const nameW = Math.min(160, Math.max(70, ...all.map((x) => textW(x.name, FS) + 12)));
  const daysW = 150, rateW = 70, revW = 52;
  // 横棒の長さは、担当者のうち作成の日数がいちばん多い人を最長にする(担当なしの行は含めない。はみ出すときは最長で止める)
  const maxDays = Math.max(1, ...rows.map((x) => x.days));
  const mark = (k) => (sort?.key === k ? (sort.dir === 'asc' ? ' ▲' : ' ▼') : '');
  const cols = [['担当者', nameW, null], [`作成の日数${mark('days')}`, daysW, 'days'], [`稼働率${mark('rate')}`, rateW, 'rate'], ['確認者', revW, null]];
  const out = [];
  let x = M;
  for (const [t, w, k] of cols) {
    const cell = `<rect x="${x}" y="${TOP}" width="${w}" height="${HR * 3}" fill="${COL.head}" stroke="${COL.grid}"/>` + T_(x + w / 2, TOP + HR * 1.5 + 4, t, { fs: FS, anchor: 'middle', weight: '600' });
    out.push(k ? `<g data-sort="${k}"><title>クリックで並べ替える(書いた順 → 少ない順 → 多い順)</title>${cell}</g>` : cell);
    x += w;
  }
  const shown = opts.rows ? all.slice(opts.rows[0], opts.rows[1]) : all;
  const gx = x, bodyY = TOP + HR * 3, n = shown.length;
  out.push(...timeGrid(r, gx, TOP, HR, nDays, DW, bodyY, n * RH));
  for (let i = 0; i <= n; i++) out.push(`<path d="M${gx} ${bodyY + i * RH}H${gx + nDays * DW}" stroke="${COL.grid}" stroke-width=".6"/>`);
  shown.forEach((row, i) => {
    const y = bodyY + i * RH;
    // 本人の休み(その人の行に斜線)
    if (row.member) for (let d = 0; d < nDays; d++) if (!r.isOff(s0 + d) && r.memberOff(row.member, s0 + d)) out.push(`<rect x="${gx + d * DW + .5}" y="${y + .5}" width="${DW - 1}" height="${RH - 1}" fill="url(#hatch)"/>`);
    // 左の欄
    let cx = M;
    const cell = (w, inner) => { const c = `<rect x="${cx}" y="${y}" width="${w}" height="${RH}" fill="#fff" stroke="${COL.grid}"/>${inner}`; cx += w; return c; };
    let left = cell(nameW, T_(cx + 5, y + 17, clip(row.name, nameW - 10, FS), { fs: FS, fill: row.member ? COL.text : COL.sub }));
    const bw = Math.round((daysW - 64) * Math.min(1, row.days / maxDays) * 10) / 10;
    left += cell(daysW, `<rect x="${cx + 5}" y="${y + 7}" width="${bw}" height="${RH - 14}" fill="${COL.sub}"/>` + T_(cx + daysW - 6, y + 17, `${fmtDays(row.days)} 日`, { fs: FS, anchor: 'end' }));
    left += cell(rateW, T_(cx + rateW - 6, y + 17, row.rate === null ? '―' : `${Math.round(row.rate * 100)}%`, { fs: FS, anchor: 'end' }));
    left += cell(revW, T_(cx + revW - 6, y + 17, row.review === null ? '―' : `${row.review} 件`, { fs: FS, anchor: 'end' }));
    out.push(row.member ? `<g data-id="m${row.i}" data-start="${row.member.start}" data-end="${row.member.end}"><title>${esc(row.name)}</title>${left}</g>` : left);
    // 棒(管理番号を書き、入りきれば名前も書く)
    for (const t of row.tasks) {
      const by = y + 4, h = RH - 8;
      // 隣り合うタスクの棒が 1 本に見えないよう、塗りの棒には白い縁を付ける
      let s = barSvg(r, t, gx, DW, by, h, statusAttr(t.status) + (t.status === 'todo' ? '' : ' stroke="#fff" stroke-width="1"'));
      if (t.f > t.s) {
        const x0 = gx + t.s / 1000 * DW, w0 = (t.f - t.s) / 1000 * DW;
        const label = textW(`${t.num} ${t.name}`, 11) + 8 <= w0 ? `${t.num} ${t.name}` : textW(t.num, 11) + 8 <= w0 ? t.num : '';
        if (label) s += T_(x0 + 4, by + h / 2 + 4, label, { fs: 11, fill: t.status === 'doing' || t.status === 'blocked' ? '#fff' : COL.text });
      }
      // 遅延: 棒の右上にえんじの丸を付ける(次のタスクの棒と重ならないよう、文字ではなく印にする)
      const late = isLate(r, t, today);
      if (late) s += `<circle cx="${gx + t.f / 1000 * DW + (t.f === t.s ? h / 2 : 0) - 1}" cy="${by + 1}" r="4" fill="${COL.accent}" stroke="#fff" stroke-width="1"/>`;
      out.push(`<g ${sel(t)}><title>${esc(barTitle(r, t, late))}</title>${s}</g>`);
    }
  });
  out.push(...markLines(r, gx, TOP, HR, nDays, DW, bodyY + n * RH, endD, today));
  const title = `担当者別ガントチャート(担当を入れた日程 ${r.sched.spanDays} 日、${fmtDate(s0)} 〜 ${fmtDate(r.sched.finishDate)})`;
  const lg = legendSvg(today, M, '。稼働率は、作成の日数 ÷ その人が作業できる日数(図の期間から全体の休みと本人の休みを除く)。見出しのクリックで並べ替え', true, true);
  const W = gx + nDays * DW + M + 30;
  return wrapSvg(Math.max(W, textW(title, 13) + 2 * M, lg.w + M), bodyY + n * RH + 30 + M, HATCH + T_(M, 24, title, { fs: 13, weight: '600' }) + lg.svg + out.join(''));
}

// ---- サマリー(仕様書 7.8 節)。計画の概要・タスクの進み具合・予定との比べ・遅延と問題発生・担当者ごと・MOP・警告を 1 枚にまとめる
// 今日までに終わる予定だったタスクの長さ(1/1000 日)。日程どおりに進んだとき、今日の始まりまでに済んでいるはずの長さ
function plannedByToday(r, today) {
  if (today === null) return null;
  const T = (today - r.sched.start) * 1000;
  return r.tasks.reduce((a, t) => a + Math.min(t.days, workUntil(r, t, T)), 0);
}
const SUM_CAT = [['検査 C1', 'C1: FBS に対応する PBS'], ['検査 C2', 'C2: PBS に対応する FBS'], ['検査 C3', 'C3: FBS の MOP'], ['検査 C4', 'C4: PBS のためのタスク'], ['検査 C5', 'C5: タスクの作成者'], ['書き方', '書き方'], ['日程', '日程']];
function renderSummary(r, opts = {}) {
  const M = 20, FS = 12, RH = 22, W0 = 760;
  const today = opts.today ? parseDate(opts.today) : null;
  const s0 = r.sched.start, out = [];
  let y = 24;
  let lastH2 = null;
  const h2 = (t) => { y += 40; lastH2 = { label: t, y }; out.push(T_(M, y, t, { fs: 14, weight: '600' })); out.push(`<path d="M${M} ${y + 6}H${M + W0}" stroke="${COL.grid}"/>`); y += 8; };
  const line = (t, o = {}) => { y += 18; out.push(T_(M + (o.ind ?? 0), y, t, { fs: o.fs ?? FS, fill: o.fill })); };
  const pct = (a, b) => (b > 0 ? `${Math.round(a / b * 100)}%` : '―');
  // 表: cols は [見出し, 幅, 右寄せ]。rows は { cells, id(選べるとき), start, end }
  const table = (cols, rows) => {
    let x = M;
    const o0 = out.length, y0 = y;
    for (const [h, w] of cols) { out.push(`<rect x="${x}" y="${y}" width="${w}" height="${RH}" fill="${COL.head}" stroke="${COL.grid}"/>` + T_(x + 5, y + 15, h, { fs: FS, weight: '600' })); x += w; }
    y += RH;
    for (const row of rows) {
      x = M;
      let g = '';
      row.cells.forEach((c, i) => {
        const [, w, right] = cols[i];
        const v = typeof c === 'object' ? c : { t: c };
        g += `<rect x="${x}" y="${y}" width="${w}" height="${RH}" fill="#fff" stroke="${COL.grid}"/>` + T_(right ? x + w - 6 : x + 5, y + 15, clip(String(v.t), w - 10, FS), { fs: FS, anchor: right ? 'end' : null, fill: v.fill, weight: v.weight });
        x += w;
      });
      out.push(row.id ? `<g data-id="${row.id}" data-start="${row.start}" data-end="${row.end}">${row.title ? `<title>${esc(row.title)}</title>` : ''}${g}</g>` : g);
      y += RH;
    }
    if (opts.collect && lastH2) {
      opts.collect.anchors.push({ kind: 'table', index: opts.collect.tables.length, label: lastH2.label, y: lastH2.y, fs: 14 });
      opts.collect.tables.push({ name: lastH2.label, header: cols.map((c) => c[0]), rows: rows.map((row) => row.cells.map((c) => String(typeof c === 'object' ? c.t : c))), frag: out.slice(o0).join(''), box: [M, y0, cols.reduce((a, c) => a + c[1], 0), y - y0] });
      lastH2 = null;
    }
  };
  // 横棒(部分の並び。[長さ, 塗りの属性])
  const bar = (parts, total, w = 420) => {
    y += 8;
    let x = M;
    out.push(`<rect x="${M}" y="${y}" width="${w}" height="16" fill="#fff" stroke="${COL.line}"/>`);
    for (const [v, fill] of parts) { if (!v || !total) continue; const bw = w * v / total; out.push(`<rect x="${x}" y="${y}" width="${bw}" height="16" ${fill}/>`); x += bw; }
    out.push(`<rect x="${M}" y="${y}" width="${w}" height="16" fill="none" stroke="${COL.line}"/>`);
    y += 16;
  };

  // 1. 計画の概要
  out.push(T_(M, y, `サマリー: ${r.sec.WBS.root.name}`, { fs: 15, weight: '600' }));
  h2('計画の概要');
  line(`期間: ${fmtDate(s0)} 〜 ${r.sec.end && r.sec.end.date !== null ? fmtDate(r.sec.end.date) : '(end: なし)'}${today !== null ? `   今日: ${fmtDate(today)}` : ''}`);
  line(summaryText(r)[0]);
  line(`タスク ${r.tasks.length} 件、メンバー ${r.members.length} 人`);

  // 2. タスクの進み具合
  h2('タスクの進み具合');
  const keys = Object.keys(STATUS);
  const cnt = Object.fromEntries(keys.map((k) => [k, r.tasks.filter((t) => t.status === k)]));
  const days = Object.fromEntries(keys.map((k) => [k, cnt[k].reduce((a, t) => a + t.days, 0)]));
  const totalDays = r.tasks.reduce((a, t) => a + t.days, 0);
  bar(['done', 'doing', 'blocked', 'todo'].map((k) => [days[k], statusAttr(k)]), totalDays);
  let lx = M + 436;
  out.push(T_(lx, y - 3, `完了 ${pct(days.done, totalDays)}(日数)、${pct(cnt.done.length, r.tasks.length)}(件数)`, { fs: FS, weight: '600' }));
  y += 6;
  table([['進捗', 120], ['件数', 80, true], ['日数', 100, true]], keys.map((k) => ({ cells: [STATUS[k], `${cnt[k].length} 件`, `${fmtDays(days[k])} 日`] })).concat([{ cells: [{ t: '計', weight: '600' }, { t: `${r.tasks.length} 件`, weight: '600' }, { t: `${fmtDays(totalDays)} 日`, weight: '600' }] }]));

  // 3. 予定との比べ
  h2('予定との比べ');
  const plan = plannedByToday(r, today);
  if (plan === null) line('今日の日付がないため、比べられません。', { fill: COL.sub });
  else {
    const doneD = days.done;
    const diff = plan - doneD;
    line(`今日までに終わる予定: ${fmtDays(plan)} 日分(全体の ${pct(plan, totalDays)})`);
    line(`完了: ${fmtDays(doneD)} 日分(全体の ${pct(doneD, totalDays)})`);
    line(diff > 0 ? `予定より ${fmtDays(diff)} 日分遅れています` : diff < 0 ? `予定より ${fmtDays(-diff)} 日分進んでいます` : '予定どおりです', { fill: diff > 0 ? COL.accent : COL.text, fs: 13 });
    bar([[Math.min(doneD, totalDays), statusAttr('done')]], totalDays);
    if (totalDays > 0) { const px = M + 420 * Math.min(plan, totalDays) / totalDays; out.push(`<path d="M${px} ${y - 22}V${y + 6}" stroke="${COL.line}" stroke-width="2"/>` + T_(px, y + 18, '今日までの予定', { fs: 11, anchor: 'middle' })); y += 14; }
    out.push(T_(M + 436, y - 3 - 14, '灰色: 完了した日数', { fs: 11, fill: COL.sub }));
  }

  // 4. 遅延と問題発生
  h2('遅延と問題発生');
  const lates = r.tasks.filter((t) => isLate(r, t, today) || t.status === 'blocked');
  if (!lates.length) line(today === null ? '問題発生のタスクはありません(今日の日付がないため、遅延は調べていません)。' : '遅延と問題発生のタスクはありません。', { fill: COL.sub });
  else {
    y += 8;
    table([['WBS 番号', 80], ['タスク', 260], ['作成者', 120], ['終了予定日', 100], ['進捗', 80], ['遅延', 50]], lates.map((t) => {
      const late = isLate(r, t, today);
      return { id: t.id, start: t.start, end: t.end, title: r.qname(t), cells: [t.num, t.name, who(r, t.by) || '(なし)', fmtDate(s0 + t.d1), { t: STATUS[t.status], fill: t.status === 'blocked' ? COL.accent : undefined }, { t: late ? '遅延' : '', fill: COL.accent, weight: '600' }] };
    }));
  }

  // 5. 担当者ごとの状況
  h2('担当者ごとの状況');
  y += 8;
  const prow = (name, list, m, i) => {
    const c = (k) => `${list.filter((t) => t.status === k).length}`;
    const nl = list.filter((t) => isLate(r, t, today)).length;
    return { id: m ? `m${i}` : null, start: m?.start, end: m?.end, cells: [m ? name : { t: name, fill: COL.sub }, c('todo'), c('doing'), c('done'), { t: c('blocked'), fill: c('blocked') !== '0' ? COL.accent : undefined }, { t: today === null ? '―' : `${nl}`, fill: nl ? COL.accent : undefined, weight: nl ? '600' : null }, `${fmtDays(list.reduce((a, t) => a + t.days, 0))} 日`] };
  };
  const prows = r.members.map((m, i) => prow(m.name, r.tasks.filter((t) => t.by.includes(m)), m, i));
  const none = r.tasks.filter((t) => !t.by.length);
  if (none.length) prows.push(prow('(担当なし)', none, null));
  table([['担当者', 120], ['実行前', 64, true], ['実行中', 64, true], ['完了', 64, true], ['問題発生', 72, true], ['遅延', 56, true], ['作成の日数', 90, true]], prows);

  // 6. テスト項目(MOP)
  if (r.sec.FBS) {
    h2('テスト項目(MOP)');
    const all = r.bySec.FBS.flatMap((n) => n.mopChecked);
    const ok = all.filter(Boolean).length;
    if (!all.length) line('MOP はまだ書かれていません。', { fill: COL.sub });
    else {
      bar([[ok, `fill="${COL.blue}"`]], all.length);
      out.push(T_(M + 436, y - 3, `チェック済み ${ok} / ${all.length} 件(${pct(ok, all.length)})`, { fs: FS, weight: '600' }));
    }
  }

  // 7. 検査の警告
  h2('検査の警告');
  const ws = r.diags.filter((d) => d.level === 'warn');
  if (!ws.length) line('警告はありません。', { fill: COL.sub });
  else {
    y += 8;
    const known = SUM_CAT.map(([c, label]) => [label, ws.filter((d) => d.cat === c).length]).filter(([, n]) => n);
    const other = ws.filter((d) => !SUM_CAT.some(([c]) => c === d.cat)).length;
    if (other) known.push(['その他', other]);
    table([['項目', 220], ['件数', 80, true]], known.map(([l, n]) => ({ cells: [l, `${n} 件`] })).concat([{ cells: [{ t: '計', weight: '600' }, { t: `${ws.length} 件`, weight: '600' }] }]));
    line('警告の中身は、左下の診断の欄で見られます。', { fill: COL.sub, fs: 11 });
  }
  return wrapSvg(Math.max(W0, textW(`サマリー: ${r.sec.WBS.root.name}`, 15)) + 2 * M, y + M, out.join('')); // 題が図の幅に収まるように
}

const VIEWS = [
  { id: 'fbs', label: 'FBS', need: ['FBS'] },
  { id: 'pbs', label: 'PBS', need: ['PBS'] },
  { id: 'match', label: 'FBS と PBS の対応', need: ['FBS', 'PBS'] },
  { id: 'wbs', label: 'WBS', need: ['WBS'] },
  { id: 'aoa', label: 'アローダイアグラム', need: ['WBS'] },
  { id: 'roles', label: '役割分担', need: ['WBS', 'members'] },
  { id: 'gantt', label: 'ガントチャート', need: ['WBS', 'start'] },
  { id: 'people', label: '担当者別ガントチャート', need: ['WBS', 'start', 'members'] },
  { id: 'mop', label: 'テスト項目(MOP)', need: ['FBS'] },
  { id: 'summary', label: 'サマリー', need: ['WBS', 'start'] },
];
const GANTT_MAX_DAYS = 1096;
function render(r, view, opts = {}) {
  const v = VIEWS.find((x) => x.id === view);
  const miss = v.need.filter((k) => !r.sec[k]);
  if (miss.length) return { svg: null, message: `このビューには ${miss.map((k) => `「${k}:」`).join('と')}の節が必要です。テキストに書いていないので描けません。` };
  switch (view) {
    case 'fbs': return { svg: renderTree(r, 'FBS') };
    case 'pbs': return { svg: renderTree(r, 'PBS') };
    case 'match': return { svg: renderMatch(r) };
    case 'mop': return { svg: renderMop(r, { collect: opts.collect }) };
    case 'summary': return { svg: renderSummary(r, opts) };
    case 'wbs': return { svg: renderTree(r, 'WBS') };
    case 'aoa': return { svg: renderAOA(r, { collect: opts.collect }) };
    case 'roles': return { svg: renderRoles(r, { collect: opts.collect }) };
    case 'gantt': case 'people': {
      // 期間が長すぎると図が大きくなりすぎて固まるので、描かずに知らせる(仕様書 7.5 節)
      const { nDays } = figDays(r);
      if (nDays > GANTT_MAX_DAYS) return { svg: null, message: `ガントチャートの期間が ${nDays} 日あり、描ける長さ(${GANTT_MAX_DAYS} 日。約 3 年)を超えるので描きません。end: の日付や days: の値を確かめてください。` };
      return { svg: view === 'gantt' ? renderGantt(r, opts) : renderPeople(r, opts) };
    }
    default: return { svg: null, message: '' };
  }
}

// タスク t が、開始から時刻 T(1/1000 日)までに作業できる長さ(休みの日を除く)。ガントチャートのドラッグで使う(仕様書 11.3 節)
function workUntil(r, t, T) {
  let w = 0;
  for (let d = Math.floor(t.s / 1000); d * 1000 < T; d++) {
    const dn = r.sched.start + d;
    if (r.isOff(dn) || t.by.some((m) => r.memberOff(m, dn))) continue;
    w += Math.max(0, Math.min(T, (d + 1) * 1000) - Math.max(t.s, d * 1000));
  }
  return w;
}

// ---- 印刷のページ(仕様書 9 章)。1 ページに収めると元の大きさの半分より小さくなるビューは、ページを分ける
// 基準は A4 横(96 dpi で 1123 × 794 px)から内側の空き 10 mm ずつを引いた大きさ。サマリーは縦向きで、分けない
const PRINT_W = 1047, PRINT_H = 718, PRINT_MIN = 0.5;
const svgSize = (svg) => { const m = /width="(\d+)" height="(\d+)"/.exec(svg); return [+m[1], +m[2]]; };
// portrait: 縦向きのページ(幅と高さを入れ替える)
const printScale = (svg, portrait) => { const [w, h] = svgSize(svg); return portrait ? Math.min(1, PRINT_H / w, PRINT_W / h) : Math.min(1, PRINT_W / w, PRINT_H / h); };
// 行で区切る: draw([始め, 終わり)) が描くページを、縮み方が target 以上に収まる行数ずつに分ける
function splitRanges(n, draw, target, portrait) {
  const ranges = [];
  let a = 0;
  while (a < n) {
    let lo = 1, hi = n - a;
    while (lo < hi) { const mid = Math.ceil((lo + hi) / 2); if (printScale(draw([a, a + mid]), portrait) >= target) lo = mid; else hi = mid - 1; }
    ranges.push([a, a + lo]);
    a += lo;
  }
  return ranges;
}
const splitRows = (n, draw, target, portrait) => splitRanges(n, draw, target, portrait).map(draw);
// 表の行の目標の縮み方: 幅で決まる縮み方(高さでそれ以上は縮めない。幅のために半分より小さくなる表は、行で区切っても幅の分は縮む)
const rowTarget = (svg, portrait) => Math.min(1, (portrait ? PRINT_H : PRINT_W) / svgSize(svg)[0]);
// 縦向きで印刷するページ: サマリーと、分けたときのアローダイアグラムのタスクの表(1 ページ目の矢印の図より後)
const printPortrait = (view, i) => view === 'summary' || (view === 'aoa' && i > 0);
function printPages(r, view, opts = {}) {
  const full = render(r, view, opts);
  if (!full.svg) return [];
  if (view === 'summary' || printScale(full.svg) >= PRINT_MIN) return [full.svg];
  if (view === 'fbs' || view === 'pbs' || view === 'wbs') {
    // 木: 第 1 層の要素ごとに分ける。1 つでも半分より小さくなる要素は、その子ごとに分ける。小さいものは同じページにまとめる
    const key = view.toUpperCase(), root = r.sec[key].root;
    const sub = (n) => { const a = [n]; for (const c of n.children) a.push(...sub(c)); return a; };
    const draw = (units) => { const keep = new Set(); for (const u of units) { sub(u).forEach((x) => keep.add(x)); for (let a = u.parent; a; a = a.parent) keep.add(a); } return renderTree(r, key, { keep }); };
    let units = [...root.children];
    for (let changed = true; changed;) {
      changed = false;
      const next = [];
      for (const u of units) {
        if (u.children.some((c) => c.children.length) && printScale(draw([u])) < PRINT_MIN) { next.push(...u.children); changed = true; } else next.push(u);
      }
      units = next;
    }
    const pages = [];
    let cur = [], s0 = 1;
    for (const u of units) {
      if (cur.length && printScale(draw([...cur, u])) >= Math.min(s0, 0.75)) { cur.push(u); continue; }
      if (cur.length) pages.push(draw(cur));
      cur = [u]; s0 = printScale(draw(cur));
    }
    if (cur.length) pages.push(draw(cur));
    return pages;
  }
  if (view === 'roles') {
    const target = rowTarget(full.svg);
    const draw = (rows) => renderRoles(r, { rows, sum: false });
    const ranges = splitRanges(r.tasks.length, draw, target);
    const pages = ranges.map(draw);
    // 担当者ごとのまとめは、最後のページに入れば入れ、入らなければ次のページにする
    const withSum = renderRoles(r, { rows: ranges[ranges.length - 1] });
    if (printScale(withSum) >= target) pages[pages.length - 1] = withSum; else pages.push(renderRoles(r, { table: false }));
    return pages;
  }
  if (view === 'mop') {
    let n = 0;
    for (const x of r.bySec.FBS) n += x.mops.length + (x.parent && !x.children.length && !x.mops.length ? 1 : 0);
    return splitRows(n, (rows) => renderMop(r, { rows }), rowTarget(full.svg));
  }
  if (view === 'gantt') return splitRows(r.tasks.length, (rows) => renderGantt(r, { ...opts, rows }), rowTarget(full.svg));
  if (view === 'people') {
    const n = r.members.length + (r.tasks.some((t) => !t.by.length) ? 1 : 0);
    return splitRows(n, (rows) => renderPeople(r, { ...opts, rows }), rowTarget(full.svg));
  }
  if (view === 'aoa') {
    // アローダイアグラム: 矢印の図とタスクの表を別のページにし、表は縦向きのページで、収まらなければ行で区切る
    const tableFull = renderAOA(r, { part: 'table' });
    return [renderAOA(r, { part: 'diagram' }), ...splitRows(r.tasks.length, (rows) => renderAOA(r, { part: 'table', rows }), rowTarget(tableFull, true), true)];
  }
  return [full.svg];
}

// 選んだ要素の情報(画面の下の欄)
function describe(r, id, opts = {}) {
  if (/^m\d+$/.test(id)) { const m = r.members[+id.slice(1)]; return m ? { kind: 'メンバー', name: m.name, items: [m.off.length ? ['休み', offText(m.off)] : null, m.note ? ['note', m.note] : null].filter(Boolean) } : null; }
  const n = r.nodes.find((x) => x.id === id);
  if (!n) return null;
  const items = [];
  const kind = n.sec === 'WBS' ? (!n.parent ? 'WBS の根' : n.children.length ? 'WBS の要素' : 'タスク') : `${n.sec} の${n.parent ? '要素' : '根'}`;
  if (n.num) items.push([`${n.sec} 番号`, n.num]);
  if (n.sec === 'FBS' && n.mops.length) items.push(['MOP', n.mops.map((m, i) => `${n.mopChecked[i] ? '✓ ' : ''}${m}`).join(' / ')]);
  if (n.sec === 'PBS' && n.R.realizes?.length) items.push(['実現する機能', n.R.realizes.map((x) => x.name).join('、')]);
  if (n.sec === 'WBS') {

    if (n.review.length) items.push(['確認者', n.review.map((x) => x.name).join('、')]);
    if (n.parent && !n.children.length) {

      items.push(['日程', `${fmtDate(r.sched.start + n.d0)} 〜 ${fmtDate(r.sched.start + n.d1)}`]);

// ---- 生成 AI に渡す修正依頼の文
function toPrompt(diags, text) {
  const out = [];
  out.push('次の「プロジェクト計画」(https://plan.sapp.jp)のテキスト記法について、下の診断の内容を直したテキストを書いてください。');
  out.push('返すテキストはコードブロック(```)で囲まず、テキストだけを書いてください。見出し(#)・番号付きのリスト・説明の文の行は書けません(構文エラーになります)。');
  out.push('書き方の要点: 1 行目の「version: 日付」は保存した日で、アプリが書くので、そのまま残す(ほかの場所には書かない)。節は「start:」「end:」「off:」「members:」「FBS: 根の名前」「PBS: 根の名前」「WBS: 根の名前」。要素は「- 名前」の字下げで階層を作り、属性は名前の後ろに「予約語: 値」を並べる(FBS は mop: mop*:(チェック済みの MOP) note:、PBS は realizes: note:、WBS は for: days: by: review: after: status: note:)。複数の値はカンマ区切り。参照は名前で書き、同じ名前が複数あれば「親::子」と書く。メモは note: に書く。メンバーの行には off:(その人の休み)と note: を書ける。// から行末までは注(行頭か空白の後の // だけ)。「* 」「+ 」で始まるリストは書けない。** と __ は、太字のつもりでなくても、名前と参照の値には書けない(__init__.py のような名前も不可)。note:・mop:・mop*: の文には書ける。status: はタスク(末端の要素)の状態で、todo(実行前)・doing(実行中)・done(完了)・blocked(問題発生)のどれか。書かなければ todo。');
  out.push('');
  const er = diags.filter((d) => d.level === 'error'), wr = diags.filter((d) => d.level === 'warn');
  if (er.length) { out.push('## エラー'); for (const d of er) out.push(`- ${d.line} 行: ${d.message}`); out.push(''); }
  if (wr.length) { out.push('## 警告'); for (const d of wr) out.push(`- ${d.line} 行: ${d.message}`); out.push(''); }
  out.push('## テキスト(「----- ここから -----」と「----- ここまで -----」の間)');
  out.push('----- ここから -----');
  out.push(text.replace(/^\uFEFF/, ''));
  out.push('----- ここまで -----');
  return out.join('\n');
}

// ---- 保存と読み込み(SVG に原文を埋め込む)
const META_ID = 'plan-source';
function b64enc(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
function b64dec(s) { const bin = atob(s.replace(/\s+/g, '')); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
function embedSource(svg, text) {
  const i = svg.indexOf('>', svg.indexOf('<svg'));
  const meta = `<metadata id="${META_ID}">${b64enc(new TextEncoder().encode(text))}</metadata>`;
  return '<?xml version="1.0" encoding="UTF-8"?>\n<!-- プロジェクト計画(https://plan.sapp.jp)で作った図。metadata に元のテキストを含み、このファイルをプロジェクト計画で開くと編集を続けられる -->\n'
    + svg.slice(0, i + 1) + meta + svg.slice(i + 1);
}
function extractSource(svgText) {
  const m = new RegExp(`<metadata id="${META_ID}">([A-Za-z0-9+/=\\s]*)</metadata>`).exec(svgText);
  if (!m) return { ok: false, error: 'この SVG にはテキストが埋め込まれていません(版 0.30 までに「画像…」で保存した .svg だけを開けます。図・表のボタンで保存した SVG にはテキストを入れていません)' };
  try { return { ok: true, text: new TextDecoder('utf-8', { fatal: true }).decode(b64dec(m[1])) }; }
  catch { return { ok: false, error: '埋め込まれたテキストが壊れています' }; }
}

// ================= 図からの編集(仕様書 11 章) =================
// テキストが正本。図での操作は、ここでテキストの書き換えに直す。どの関数も、解析し直す前の結果 r と

  const subtree = (n) => { const a = [n]; for (const c of n.children ?? []) a.push(...subtree(c)); return a; };
  const lastLineEnd = (n) => Math.max(...subtree(n).map((x) => x.lineEnd));
  const isAnc = (a, b) => { for (let x = b.parent; x; x = x.parent) if (x === a) return true; return false; };
  const fail = (error) => ({ error });

  // 書き換え(位置の並び)をテキストに当てる
  const apply = (text, edits) => {

  };

  // 修飾名の候補(節の要素の並び list の中で、segs に当てはまるもの)
  const matches = (list, segs, noRoot) => list.filter((m) => {
    if (m.name !== segs[segs.length - 1] || (noRoot && !m.parent)) return false;
    let a = m.parent;
    for (let j = segs.length - 2; j >= 0; j--) { if (!a || a.name !== segs[j]) return false; a = a.parent; }
    return true;

  // 参照に書く名前: その節で一意に決まる、いちばん短い修飾名

    if (RE_KW.test(v)) return `${what}に「空白 + 予約語 + 半角コロン」は書けません(そこから別の属性と読まれます。全角のコロンを使ってください)`;

  //  1. 新しいエラーが出ない(削除だけは、消した要素への参照のエラーを認める)
  //  2. 対象でない要素は、親子関係・属性・参照先が変わらない

  function commit(r, edits, o) {
    const text = apply(r.text, edits);

    const p2 = r2.parse;
    const errs = r2.diags.filter((d) => d.level === 'error');

      if (o.removed?.has(n)) continue;

      if (!m) return fail('書き換えの位置がずれるため、書き換えませんでした(テキストの書き方を確かめてください)');

      for (const v of list) { const b = badText(v, '値', true); if (b) return fail(b); }

    }

    const edits = [];
    const list = key === 'mop' ? (Array.isArray(value) ? value : [value]).map((v) => String(v).trim()).filter(Boolean) : [String(value).trim()].filter(Boolean);
    for (const v of list) { const b = badText(v, '値', FREE_ATTRS.includes(key)); if (b) return fail(b); }

    const olds = n.attrList.filter((a) => a.key === key);
    // 元の位置のまま置き換え、余れば消し、足りなければ行の終わりに足す
    olds.forEach((a, i) => edits.push(i < list.length ? { start: a.kstart, end: a.end, text: `${key}: ${list[i]}` } : cutAttr(text, a)));
    if (list.length > olds.length) edits.push({ start: n.end, end: n.end, text: list.slice(olds.length).map((v) => ` ${key}: ${v}`).join('') });
    if (!edits.length) return { text, select: keyOf(n) };
    return commit(r, edits, {
      skip: new Set([n]), skipKeys: [key], select: keyOf(n),
      expect: (r2, nw) => {
        const m = nw(n);
        const got = m.attrList.filter((a) => a.key === key).map((a) => a.text);
        return got.join('\u0001') === list.join('\u0001') ? null : `「${key}:」の値を、書いたとおりに読めないので、書き換えませんでした`;

  function rename(r, id, newName0) {

    if (sibs.some((x) => x !== n && x.name === newName)) return fail(n.isMember ? `メンバーに「${newName}」がすでにいます` : `同じ親の下に「${newName}」がすでにあります`);
    const edits = [{ start: n.nameStart, end: n.nameEnd, text: newName }];

    for (const m of [...r.nodes, ...r.members]) for (const at of m.attrList) for (const ref of at.refs ?? []) if (ref.node) refs.push(ref);

    if (n) { r.key = keyOf(n); r.label = labelOfNode(n); r.node = n; r.planned = true; }
    // T にない記録先(5.6 節): 書いた日の版で計画にあったか、T までのどれかの版で同じ名前が 1 つに決まった(計画に足した後に消した)ものは「計画から削除」
    else if (r.planned0 === true) r.gone = !index(T).byKey.has(r.key0); // 同じ対応名の要素が T にあれば、削除ではない(移動の候補が 2 つ以上など)
    else if (!cT.length) {
      // 計画に足した後に消した作業(寄せる先の版で名前が 2 つ以上なら、曖昧な名前のまま): 名前が 1 つに決まった最後の版の要素を記録先にする(書き方が違っても、計画にあったときの要素が同じなら 1 行にまとめる)
      // 書いた日の版から寄せる先の版までのどれかで計画にあった名前だけ(消した後に初めて書いた記録は、計画にない作業のまま)
      const xs = V.indexOf(r.ver) < 0 ? [] : V.slice(V.indexOf(r.ver)).filter((x) => x.date <= T.date).reverse();
      for (const x of xs) { const c = findFor(x, r).cands; if (c.length === 1) { r.gone = true; r.key = keyOf(c[0]); r.label = labelOfNode(c[0]); break; } }
    }
  }
  return recs;
}
// 画面から今日の記録に書くときの名前(11.4・11.5 節): 今日に使う版で、その記録先の一意に決まるいちばん短い修飾名。
// 前に書いた名前が、計画の変更で一意でなくなったり、名前が変わったりしても、同じ記録先に書けるように。計画にない記録先なら fallback
function nameForWrite(V, date, key, fallback) {
  const L = V && V.length ? versionFor(V, date) : null;
  const n = L ? index(L).byKey.get(key) : null;
  if (!n) return fallback;
  return shortName(n, [...index(L).wbs, ...index(L).fbs]);
}
// 一意に決まるいちばん短い修飾名(補完で入れる名前)
function shortName(n, nodes) {
  const segs = [n.name];
  for (let a = n.parent; ; a = a.parent) {
    if (findNodes(nodes, segs).length <= 1 || !a) return segs.join('::');
    segs.unshift(a.name);
  }
}

// マイログを解析して照合する。plans は計画書の一覧(loadPlan の並び)。opt: { today }
function analyze(text0, plans = [], opt = {}) {
  const p = parse(text0, opt);
  const res = { ...p, plans };
  if (!p.ok) { res.diags = p.diags.filter((d) => d.level === 'error'); return res; }
  const V = plans.filter((e) => e.usable);
  const lab = labels(plans);
  res.V = V;
  // 最新の版(5.4 節): 今日より後の日付の版は使わない(手で先の日付を書いた版があっても、今日の時点の計画で見る)
  res.latest = !V.length ? null : opt.today != null ? versionFor(V, opt.today) : V[V.length - 1];
  const future = opt.today != null ? V.filter((e) => e.date > opt.today) : [];
  res.who = p.set.by.value;
  const W = (r, start, end, message) => p.diags.push({ level: 'warn', cat: '計画との照合', line: r.line, start, end, message });
  // プロジェクト分析は基準日の版を使うので、この知らせは出さない(opt.team)
  if (future.length && !opt.team) p.diags.push({ level: 'warn', cat: '計画との照合', line: 1, start: 0, end: 0, message: `計画書の一覧に、今日より後の日付の版があります(${future.map((e) => lab.get(e)).join('、')})。最新の版としては使いません` });
  if (plans.length && !V.length) p.diags.push({ level: 'warn', cat: '計画との照合', line: 1, start: 0, end: 0, message: '計画書の一覧に、照合に使える版(エラーがなく version: のある版)がありません。照合していません' });
  // by: の名前が最新の版の members: にいるか
  if (res.latest && !index(res.latest).members.includes(res.who)) {
    const s = p.set.by;
    p.diags.push({ level: 'warn', cat: '計画との照合', line: s.line, start: s.vStart, end: s.vEnd, message: `「${res.who}」が計画(${lab.get(res.latest)})の members: にいません` });
  }
  for (const r of p.recs) {
    r.who = res.who;
    let e = versionFor(V, r.date);
    if (!e) { r.ver = e; r.planned = null; r.key = `X:${r.name}`; r.label = r.name; continue; }
    let { cands, where } = findFor(e, r);
    // 版の日付と同じ日付の記録(5.4 節): その版で決まらなければ、同じ日付のそれより上の版を下から順に、続いてそれより前の日付の最後の版を探す。
    // status:・progress: のある記録が、その版で途中の要素に当たる(その日にタスクを分けた)ときも、前の版でタスクに当たれば前の版で照合する
    const wantsTask = r.val.status !== undefined || r.val.progress !== undefined;
    const notTask = (c) => wantsTask && c.length === 1 && c[0].sec === 'WBS' && c[0].children.length > 0;
    if ((cands.length !== 1 || notTask(cands)) && e.date === r.date) {
      const i = V.indexOf(e);
      const alt = [...V.slice(0, i).filter((x) => x.date === r.date).reverse(), ...V.slice(0, i).filter((x) => x.date < r.date).slice(-1)];
      const first = notTask(cands); // その版で途中の要素に当たったときだけ、前の版の途中の要素を飛ばす
      for (const x of alt) { const f = findFor(x, r); if (f.cands.length === 1 && !(first && notTask(f.cands))) { e = x; ({ cands, where } = f); break; } }
    }
    r.ver = e;
    const ix = index(e);
    const vl = lab.get(e);
    if (cands.length === 1) {
      const n = cands[0];
      r.node = n; r.planned = true; r.key = keyOf(n); r.label = labelOfNode(n);
    } else {
      r.planned = false; r.key = `X:${r.name}`; r.label = r.name;
      // 最新の版で 1 つに決まる名前(後の版で計画に足した作業)は、診断を出さない(5.6 節)
      if (!cands.length) { if (!(res.latest && findFor(res.latest, r).cands.length === 1)) W(r, r.nameStart, r.nameEnd, `「${r.name}」が計画(${vl})の ${where.endsWith('にも') ? where : `${where} に`}ありません(この日の版にない名前です)`); }
      else W(r, r.nameStart, r.nameEnd, `「${r.name}」が計画(${vl})の ${where} に ${cands.length} つあり、どれか決まりません。親::子 の形で書いてください(候補: ${cands.map(labelOfNode).join('、')})`);
    }
    // 状態と進捗率はタスクにだけ書ける(仕様書 3.7 節)
    if (r.node && r.node.children.length) {
      for (const k of ['status', 'progress']) if (r.val[k] !== undefined) { W(r, r.at[k].start, r.at[k].end, `「${r.label}」はタスク(WBS の末端)ではないので、${k}: は無視します`); delete r.val[k]; }
    }
    // MOP の文の一致(1 文字も違わない。前後の空白は比べない)
    if (r.val.test && r.node && !r.node.mops.some((t) => t.trim() === r.val.mop)) W(r, r.at.mop.start, r.at.mop.end, `MOP の文が計画(${vl})の「${r.label}」の MOP と一致しません`);
    // 依頼の相手が members: にいるか
    for (const k of ['review', 'ask']) if (r.val[k]) for (const nm of r.val[k]) if (!ix.members.includes(nm)) W(r, r.at[k].start, r.at[k].end, `「${nm}」が計画(${vl})の members: にいません`);
  }
  // status: を書かずに progress: を書いた行は、進捗率から状態を決める(4.2 節): 100 なら完了、100 未満なら実行中
  for (const r of p.recs) if (r.val.progress !== undefined && r.val.status === undefined) { r.val.status = r.val.progress === 100 ? 'done' : 'doing'; r.statusFromProgress = true; }
  // 記録先を最新の版の要素に寄せる(5.6 節)
  remap(p.recs, V, res.latest);
  res.diags = p.diags;
  res.ok = true;
  return res;
}

// ================= 記録のまとめ =================
// logs: [{ who, recs, fi(ファイルの番号) }]。同じ日付の記録は、ファイルの番号、テキストの順で並べる
const ord = (r) => [r.date, r.fi ?? 0, r.order];
const cmp = (a, b) => { const x = ord(a), y = ord(b); return x[0] - y[0] || x[1] - y[1] || x[2] - y[2]; };
function allRecs(logs, upto) {
  const out = [];
  logs.forEach((l, fi) => { for (const r of l.recs) if (upto === undefined || upto === null || r.date <= upto) { r.fi = fi; out.push(r); } });
  return out.sort(cmp);
}
const lastOf = (recs, k) => { let x = null; for (const r of recs) if (r.val[k] !== undefined) x = r; return x; };
// 複数の人が同じ記録先に報告したときのまとめ方(4.2 節)。人ごとの最後の報告をとってからまとめる(一覧の順によらない)
//   状態: 全員が完了なら完了、1 人でも問題発生なら問題発生、それ以外で誰かが実行中か完了なら実行中、それ以外は実行前
//   進捗率: 人ごとの最後の進捗率の平均(整数に丸める)
// recs は記録の順(cmp)。1 人だけなら、その人の最後の報告そのもの
const personOf = (r) => r.who ?? '';
function perPerson(recs, k) { const m = new Map(); for (const r of recs) if (r.val[k] !== undefined) m.set(personOf(r), r); return [...m.values()]; }
// 作成者が交代したとき(4.2 節): 今の作成者(基準の版の by:)の誰かが報告していれば、今の作成者の報告だけでまとめる
function onlyAuthors(list, authors) { if (!authors || !authors.length) return list; const a = list.filter((r) => authors.includes(personOf(r))); return a.length ? a : list; }
// 日ごとのまとめに使う記録: 作成者の誰かがこの属性を一度でも報告していれば、すべての日で作成者の記録だけを使う(外れた人の古い報告で、手戻りや問題の続きが出ないように)
const authorRecs = (xs, authors) => onlyAuthors(xs, authors);
const authorsOf = (L, key) => { const n = L ? index(L).byKey.get(key) : null; return n && n.sec === 'WBS' ? memberNames(n.by) : null; };
function combineStatus(list) {
  const ss = list.map((r) => r.val.status);
  return ss.every((x) => x === 'done') ? 'done' : ss.includes('blocked') ? 'blocked' : ss.some((x) => x === 'doing' || x === 'done') ? 'doing' : 'todo';
}
// まとめた値を持つ記録を返す。もとにする記録は、いちばん新しい報告(同じ日付なら、まとめた値と同じ値の報告、次に人の名前の順)
function combined(list, k, v) {
  const d = Math.max(...list.map((r) => r.date));
  const c = list.filter((r) => r.date === d).sort((a, b) => (b.val[k] === v) - (a.val[k] === v) || String(personOf(a)).localeCompare(String(personOf(b))));
  const base = c[0];
  return base.val[k] === v ? base : { ...base, val: { ...base.val, [k]: v }, combined: true };
}
function lastStatus(recs, authors) {
  const list = onlyAuthors(perPerson(recs, 'status'), authors);
  return list.length ? combined(list, 'status', combineStatus(list)) : null;
}
function lastProgress(recs, authors) {
  const list = onlyAuthors(perPerson(recs, 'progress'), authors);
  return list.length ? combined(list, 'progress', Math.round(list.reduce((x, r) => x + r.val.progress, 0) / list.length)) : null;
}
// 最後のテストの結果(4.4 節): いちばん新しい日付の記録。同じ日付に ok と ng があれば ng(一覧の順によらない)
function lastTest(recs) {
  const tr = recs.filter((r) => r.val.test !== undefined);
  if (!tr.length) return null;
  const d = tr[tr.length - 1].date, same = tr.filter((r) => r.date === d);
  return same.filter((r) => r.val.test === 'ng').pop() || same[same.length - 1];
}
// その期間の最後の TRL(4.4 節): いちばん新しい日付の記録。同じ日付に違う値があれば小さい方(低い方に倒す)
function lastTrl(recs) {
  const tr = recs.filter((r) => r.val.trl !== undefined);
  if (!tr.length) return null;
  const d = tr[tr.length - 1].date;
  return tr.filter((r) => r.date === d).reduce((a, b) => (b.val.trl < a.val.trl ? b : a));
}
// 日ごとの、まとめた値の移り変わり(その日までの人ごとの最後の報告でまとめる)。[{ date, v, rec }]
function timeline(recs, k, f, authors) {
  const out = [], per = new Map();
  const xs = authorRecs(recs.filter((r) => r.val[k] !== undefined), authors);
  for (let i = 0; i < xs.length; i++) {
    per.set(personOf(xs[i]), xs[i]);
    if (i + 1 < xs.length && xs[i + 1].date === xs[i].date) continue;
    const list = [...per.values()];
    out.push({ date: xs[i].date, v: f(list), rec: xs[i] });
  }
  return out;
}
// 最新の版のタスクの状態: 最後の報告、なければ計画の status:
function stateOf(byKey, L, key) {
  const rr = byKey.get(key) || [];
  const s = lastStatus(rr, authorsOf(L, key));
  if (s) return { status: s.val.status, rec: s };
  const n = L ? index(L).byKey.get(key) : null;
  return { status: n ? n.status ?? 'todo' : null, rec: null };
}
function groupByKey(recs) { const m = new Map(); for (const r of recs) { if (!m.has(r.key)) m.set(r.key, []); m.get(r.key).push(r); } return m; }
// 最新の版のタスクの終了予定日(1970-01-01 からの日数)
const endOf = (L, t) => L.r.sched.start + t.d1;
const memberNames = (list) => list.map((m) => m.name);

// ================= 依頼(マイログの仕様書 4.3 節・プロジェクト分析の仕様書 6.5 節) =================
// 依頼の一覧。match が真なら、相手のマイログの返事と突き合わせる(プロジェクト分析の作業分析)
function requests(logs, upto, match) {
  const recs = allRecs(logs, upto);
  const out = [];
  for (const r of recs) for (const kind of ['review', 'ask']) for (const to of r.val[kind] || []) out.push({ kind, from: r.who, to, key: r.key, label: r.label, date: r.date, rec: r, reply: null });
  if (!match) return out;
  const replyK = { review: 'reviewed', ask: 'answered' };
  for (const r of recs) for (const kind of ['review', 'ask']) {
    if (r.val[replyK[kind]] === undefined) continue;
    // 1 つの返事は、それより前(同じ日を含む)の、同じ相手・種類で、同じ記録先か同じ名前(書いたままの名前)の未対応の依頼をすべて閉じる
    for (const q of out) if (!q.reply && q.kind === kind && q.to === r.who && (q.key === r.key || q.rec.name === r.name) && q.date <= r.date) q.reply = r;
  }
  return out;
}

// ================= 兆候(マイログの仕様書 6 章・プロジェクト分析の仕様書 6.3 節) =================
const TH_DEFAULT = { S1: 7, S2: 7, S3: 3, S5: 1, S7: 50, S8: 14 };
const SIG_NAME = { S1: '記録の途絶', S2: '問題の長期化', S3: '返事待ち', S4: '日数の超過', S5: '終了予定日の超過', S6: '手戻り', S7: '計画にない作業', S8: '進捗の停止', S9: '確認の抜け' };
const NEED_PLAN = ['S1', 'S4', 'S5', 'S7', 'S9'];
// ctx: { L(最新の版), today, th, ws(週の始まりの曜日), me(マイログ: 自分の名前), members(プロジェクト分析: メンバーの並び), noLog(マイログのないメンバー) }
// 戻り値: [{ code, who, label, text, date, rec }]
function signals(logs, ctx) {
  const th = { ...TH_DEFAULT, ...(ctx.th || {}) };
  const L = ctx.L, today = ctx.today;
  const recs = allRecs(logs, today);
  const byKey = groupByKey(recs);
  const out = [];
  const push = (code, o) => out.push({ code, ...o });
  const tasks = L ? L.r.tasks : [];
  const people = ctx.me ? [ctx.me] : (ctx.members || []);
  // マイログでは、自分が担当(by:)のタスクだけを見る
  const mine = (t) => !ctx.me || memberNames(t.by).includes(ctx.me);
  // S1 記録の途絶(プロジェクトの開始日より前は出さない)
  if (L && L.r.sched.start <= today) for (const p of people) {
    const pending = tasks.filter((t) => memberNames(t.by).includes(p) && stateOf(byKey, L, keyOf(t)).status !== 'done');
    // マイログがエラーのため集計から外れている人は、記録が途絶えたとは言えない(要確認の先頭に、除外したことを知らせる)
    if ((ctx.errLog || []).includes(p)) continue;
    if ((ctx.noLog || []).includes(p)) { push('S1', { who: p, label: '―', text: `マイログがありません。完了していない担当タスク ${pending.length} 件`, date: null, rec: null }); continue; }
    if (!pending.length) continue;
    const mineR = recs.filter((r) => r.who === p);
    const last = mineR.length ? mineR[mineR.length - 1] : null;
    if (last && today - last.date < th.S1) continue;
    push('S1', { who: p, label: '―', text: `${last ? `最後の記録 ${fmtDate(last.date)}(${today - last.date} 日前)` : '記録がありません'}。完了していない担当タスク ${pending.length} 件`, date: last ? last.date : null, rec: last });
  }
  // S2 問題の長期化(閉じ方は openProblems。プロジェクト分析では、どのメンバーの solved: でもよい)
  for (const { r, kind } of openProblems(recs, L)) {
    if (today - r.date < th.S2) continue;
    if (kind === 'issue') push('S2', { who: r.who, label: r.label, text: `未解決 ${today - r.date} 日(${fmtDate(r.date)} から): ${r.val.issue}`, date: r.date, rec: r });
    else push('S2', { who: r.who, label: r.label, text: `問題発生のまま ${today - r.date} 日(${fmtDate(r.date)} から)`, date: r.date, rec: r });
  }
  // S4 日数の超過
  if (L) for (const t of tasks) {
    if (!mine(t)) continue;
    const key = keyOf(t), rr = (byKey.get(key) || []).filter((r) => r.val.hours);
    const nd = new Set(rr.map((r) => r.date)).size;
    if (nd * 1000 > t.days && stateOf(byKey, L, key).status !== 'done') push('S4', { who: who(t), label: labelOfNode(t), text: `作業日数 ${nd} 日(計画 ${P.fmtDays(t.days)} 日)。今の進捗: ${STATUS[stateOf(byKey, L, key).status] ?? '―'}`, date: rr[rr.length - 1].date, rec: rr[rr.length - 1] });
  }
  // S5 終了予定日の超過
  if (L) for (const t of tasks) {
    if (!mine(t)) continue;
    const key = keyOf(t), st = stateOf(byKey, L, key), end = endOf(L, t);
    if (today - end >= th.S5 && st.status !== 'done') push('S5', { who: who(t), label: labelOfNode(t), text: `終了予定日 ${fmtDate(end)} から ${today - end} 日超過。今の進捗: ${STATUS[st.status]}${st.rec ? `(${fmtDate(st.rec.date)} の報告)` : '(計画の値)'}`, date: end, rec: st.rec });
  }
  // S6 手戻り(完了のあとに実行中・問題発生)
  // 日ごとのまとめた状態(4.2 節)が、完了から実行中か問題発生に戻ったとき
  for (const [key, rr] of byKey) {
    let done = null, back = null;
    for (const x of timeline(rr, 'status', combineStatus, authorsOf(L, key))) {
      if (x.v === 'done') done = x;
      else if (done && (x.v === 'doing' || x.v === 'blocked')) { back = { from: done, to: x }; done = null; }
    }
    // 人と飛び先は、まとめに使った記録(作成者の記録。4.2 節)から選ぶ
    if (back) { const to = authorRecs(rr.filter((r) => r.val.status !== undefined), authorsOf(L, key)).filter((r) => r.date === back.to.date && r.val.status !== 'done').pop() || back.to.rec; push('S6', { who: to.who, label: to.label, text: `${fmtDate(back.from.date)} に完了、${fmtDate(back.to.date)} に${STATUS[back.to.v]}`, date: back.to.date, rec: to }); }
  }
  // S7 計画にない作業(週ごと)
  if (L) {
    const wk = new Map();
    for (const r of recs) {
      if (!r.val.hours) continue;
      const k = `${r.who}|${weekOf(r.date, ctx.ws ?? 1)}`;
      if (!wk.has(k)) wk.set(k, { who: r.who, w: weekOf(r.date, ctx.ws ?? 1), all: 0, x: 0, rec: r });
      const o = wk.get(k);
      o.all += r.val.hours; if (r.planned === false) { o.x += r.val.hours; o.rec = r; }
    }
    for (const o of wk.values()) if (o.all > 0 && o.x * 100 >= th.S7 * o.all) push('S7', { who: o.who, label: '―', text: `${mmdd(o.w)}〜 の週: 計画にない作業の時間 ${fmtH(o.x)} 時間 / 週の合計 ${fmtH(o.all)} 時間(${Math.round(o.x / o.all * 100)} %)`, date: o.w, rec: o.rec });
  }
  // S8 進捗の停止
  for (const [k, rr] of byKey) {
    const pr = authorRecs(rr.filter((r) => r.val.progress !== undefined), authorsOf(L, k)); // 飛び先は、まとめに使った記録(4.2 節)から
    if (!pr.length) continue;
    // 計画があるときは、その版のタスクと、計画にない作業の記録先だけ(名前の変更の前の記録先・途中の要素になった記録先には出さない)
    if (L && !k.startsWith('X:')) { const n = index(L).byKey.get(k); if (!n || n.children.length) continue; }
    // 日ごとのまとめた進捗率(人ごとの最後の値の平均)で見る
    const tl = timeline(rr, 'progress', (list) => Math.round(list.reduce((x, r) => x + r.val.progress, 0) / list.length), authorsOf(L, k));
    const last = pr[pr.length - 1], v = tl[tl.length - 1].v;
    let i = tl.length - 1;
    while (i > 0 && tl[i - 1].v === v) i--;
    const since = tl[i];
    const st = lastStatus(rr, authorsOf(L, k));
    if (v === 100 || st?.val.status === 'done') continue;
    if (today - since.date >= th.S8) push('S8', { who: L && index(L).byKey.get(last.key) && index(L).byKey.get(last.key).sec === 'WBS' ? who(index(L).byKey.get(last.key)) : last.who, label: last.label, text: `進捗率 ${v} % のまま ${today - since.date} 日(${fmtDate(since.date)} から)`, date: since.date, rec: last });
  }
  // S9 確認の抜け
  if (L) for (const t of tasks) {
    // 作成者自身は確認者に数えない(受け継いだ review: に作成者が入っている場合など)
    const rv = memberNames(t.review).filter((m) => !memberNames(t.by).includes(m));
    if (!rv.length) continue;
    const key = keyOf(t), rr = byKey.get(key) || [];
    const done = lastOf(rr.filter((r) => r.val.status === 'done'), 'status');
    if (!done || (ctx.me && done.who !== ctx.me)) continue;
    if (rr.some((r) => r.val.review && r.date <= done.date)) continue;
    push('S9', { who: who(t), label: labelOfNode(t), text: `${fmtDate(done.date)} に完了。確認者 ${rv.join('・')} への確認の依頼(review:)の記録なし`, date: done.date, rec: done });
  }
  // S3 確認待ち・回答待ち(プロジェクト分析だけ)
  if (ctx.requests) for (const q of ctx.requests) {
    if (q.reply || today - q.date < th.S3) continue;
    push('S3', { who: `${q.from} → ${q.to}`, label: q.label, text: `${KIND_JA[q.kind]}の依頼から ${today - q.date} 日、返事なし${(ctx.errLog || []).includes(q.to) ? '(相手のマイログにエラーがあり、集計から外しています)' : (ctx.hasLog || []).includes(q.to) ? '' : '(相手のマイログがありません)'}`, date: q.date, rec: q.rec });
  }
  const order = (c) => +c.slice(1);
  const pi = (w) => { const i = people.indexOf(String(w).split(/ → |・/)[0]); return i < 0 ? people.length : i; };
  return out.map((s, i) => [s, i]).sort((a, b) => order(a[0].code) - order(b[0].code) || pi(a[0].who) - pi(b[0].who) || a[1] - b[1]).map((x) => x[0]);
  function who(t) { return memberNames(t.by).join('・') || '(担当なし)'; }
}

const FONT = "'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Meiryo','Segoe UI',sans-serif";

// 文書の形のビュー。blocks: { t: 'h2', label } | { t: 'p', text, fill } | { t: 'table', name, cols: [{ h, max, right }], rows: [{ cells: [文字 | { t, fill, bg, weight }], ref: { start, end } }] } | { t: 'fig', id, label, draw: () => { frag, w, h } }

    if (b.t === 'p') { for (const l of wrap(b.text, W0 - 2 * M, FS)) { y += 18; out.push(T_(M, y, l, { fs: FS, fill: b.fill ?? COL.sub })); } continue; }

// 図と表を 1 つずつ(保存・コピー用)。表には題を入れない。図には題を入れる

  const fits = (bs) => heightOf(bs) <= Math.max(W0, widthOf(bs)) * 1.45;

      cur.push(...(h ? [{ t: 'h2', label: first ? h.label : `${h.label}(続き)` }] : []), { ...t, rows: rows.slice(0, n) });
      flush();
      rows = rows.slice(n); first = false;
    }
  }

// ---- 図: 週ごとの合計の棒(マイログの仕様書 7.3 節)

  for (let v = 0; v <= top + 1e-9; v += step) {
    const y = TOP + H - v / top * H;
    out.push(`<path d="M${LM} ${y}H${w}" stroke="${COL.grid}"/>`, T_(LM - 6, y + 4, String(+v.toFixed(2)), { fs: 11, anchor: 'end', fill: COL.sub }));
  }
  items.forEach((x, i) => {
    const bx = LM + GAP + i * (BW + GAP), bh = x.v / top * H;
    out.push(`<rect x="${bx}" y="${TOP + H - bh}" width="${BW}" height="${bh}" fill="#bdbdb8" stroke="${COL.line}"/>`);
    if (x.v > 0) out.push(T_(bx + BW / 2, TOP + H - bh - 4, String(x.label2), { fs: 11, anchor: 'middle' }));
    out.push(T_(bx + BW / 2, TOP + H + 16, x.label, { fs: 11, anchor: 'middle' }));

// ================= マイログのビュー(マイログの仕様書 7 章) =================
const VIEWS = [
  { id: 'summary', label: 'サマリー' },
  { id: 'mytasks', label: 'タスク' },
  { id: 'gantt', label: 'ガントチャート' },
  { id: 'week', label: '週のまとめ' },
  { id: 'hours', label: '作業時間' },
  { id: 'tests', label: 'テスト・TRL・TPM' },

const refOf = (r) => (r ? { start: r.start, end: r.end } : null);

// 記録先の並び(仕様書 7.3 節): 最新の版の WBS の木の順、FBS の木の順、最後に計画にない作業(と以前の版の名前)を最初に書いた順
function keyOrder(keys, L, recs) {

  recs.forEach((r, i) => { if (!first.has(r.key)) first.set(r.key, i); });
  return [...keys].sort((a, b) => (pos.has(a) ? pos.get(a) : 1e9 + first.get(a)) - (pos.has(b) ? pos.get(b) : 1e9 + first.get(b)));

  const out = [];
  for (let w = a; w <= b; w += 7) out.push(w);

// ---- 担当のタスク(マイログの仕様書 7.1 節)
// 最新の版のタスク t の今の様子(マイログの仕様書 7.1 節・プロジェクト分析の仕様書 6.9 節)。me があれば、時間・確認の結果は me の記録だけで数える
function taskInfo(L, byKey, today, t, me) {
  const key = keyOf(t), rr = byKey.get(key) || [];
  const st = lastStatus(rr, memberNames(t.by));
  const status = st ? st.val.status : t.status ?? 'todo';
  const s = L.r.sched.start + t.d0, e = endOf(L, t);
  const mineR = me ? rr.filter((r) => r.who === me) : rr;
  // 始めた日(7.3 節): 初めて hours: を書いた日と、初めて実行中・完了・問題発生を報告した日の早い方。メモだけの記録は数えない
  const begun = rr.find((r) => r.val.hours || (r.val.status && r.val.status !== 'todo'));

  const lastRv = lastOf(rr.filter((r) => r.val.review), 'review');

// 区分(7.1 節): 遅延 → 問題発生 → 開始予定日を過ぎた未着手 → 実行中 → 開始予定日がまだ先 → 完了 の順に判定して、1 つに決める
const catOf = (x, today) => (x.late ? 'late' : x.status === 'blocked' ? 'blocked' : x.status === 'todo' && x.s <= today ? 'overstart' : x.status === 'doing' ? 'doing' : x.status === 'todo' ? 'future' : 'done');
function myTasks(a, recs, byKey, today) {

  const info = (t) => taskInfo(L, byKey, today, t, me);
  const sortT = (list) => list.sort((x, y) => x.s - y.s || order.get(x.t) - order.get(y.t));

// 区分の表の並び(7.1 節): 対応が要る区分(遅延・問題発生・開始予定日を過ぎた未着手)を、実行中のすぐ下にまとめる
const CATS = [

  { id: 'late', label: '遅延のタスク', short: '遅延' },
  { id: 'blocked', label: '問題発生のタスク', short: '問題発生' },
  { id: 'overstart', label: '開始予定日を過ぎた未着手のタスク', short: '開始予定日を過ぎた未着手' },

// 未解決の問題(4.3 節)。日数によらず、すべて。戻り値は [{ r, kind: 'issue' | 'blocked' }](記録の順)

// 同じ日なら、同じマイログでは後ろの行、別の人のマイログでは行の順によらず後とみなす(プロジェクト分析で一覧の順によって結果が変わらないように)
function openProblems(recs, L) {
  const solved = recs.filter((x) => x.val.solved !== undefined);
  const after = (x, r) => x.date > r.date || (x.date === r.date && ((x.fi ?? 0) !== (r.fi ?? 0) || cmp(x, r) > 0));
  const closers = (r) => solved.filter((x) => (x.key === r.key || x.name === r.name) && after(x, r));
  const out = [];
  for (const [, rr] of groupByKey(recs)) {
    const open = new Set();
    for (const r of rr) if (r.val.issue !== undefined && !closers(r).length) { out.push({ r, kind: 'issue' }); open.add(r); }
    // status: blocked は、ほかの状態か solved: で閉じる。最後の状態が問題発生のとき、その続きの最初の blocked から。
    // 日ごとの状態は、その日までの人ごとの最後の報告でまとめた状態(4.2 節。一覧の順によらない)
    let run = [];
    const sr = authorRecs(rr.filter((r) => r.val.status !== undefined), authorsOf(L, rr[0].key)); // 作成者の記録だけ(4.2 節)
    for (const { date: d, v } of timeline(sr, 'status', combineStatus)) {

      if (v === 'blocked') {
        // その日の blocked のうち、続きに入るもの: 同じマイログでは、その日の最後の別の状態より後ろの blocked
        for (const r of dr) if (r.val.status === 'blocked' && !dr.some((x) => (x.fi ?? 0) === (r.fi ?? 0) && x.val.status !== 'blocked' && cmp(x, r) > 0)) run.push(r);

    }
    run.sort(cmp);
    let since = run[0] || null;
    while (since) {
      const c = closers(since);
      if (!c.length) break;

      const cur = since;
      // 閉じた後の blocked は、閉じた solved: より後で、いまの blocked より記録の順で後ろのもの(同じ blocked に戻らないように)
      since = run.find((r) => cmp(r, cur) > 0 && after(r, lc)) || null;

// ガントチャート(7.4 節)
function myGantt(my, recs, today) {

  // 期間の始まりは、担当のタスクの予定の始まりと、担当のタスクに hours: を書いた最初の日(担当外の記録は入れない)
  const keys = new Set(my.tasks.map((x) => keyOf(x.t)));
  const firstRec = Math.min(Infinity, ...recs.filter((r) => r.val.hours && keys.has(r.key)).map((r) => r.date));
  const d0 = Math.min(...my.tasks.map((x) => x.s), firstRec);
  const d1 = Math.max(...my.tasks.map((x) => x.e), today);
  const n = d1 - d0 + 1;
  if (n > 1096) return { error: `図の期間が ${n} 日あり、長すぎるので描きません(日付の打ち間違いがないか確かめてください)` };
  const gx = LW, out = [];
  // 目盛り: 月・日の 2 段
  let lastM = null;
  for (let i = 0; i < n; i++) {
    const ds = fmtDate(d0 + i), x = gx + i * DW;
    if (ds.slice(5, 7) !== lastM) { lastM = ds.slice(5, 7); out.push(T_(x + 2, 14, `${+lastM} 月`, { fs: 11, fill: COL.sub }), `<path d="M${x} 0V${TOP + my.tasks.length * RH}" stroke="${COL.grid}"/>`); }
    out.push(T_(x + DW / 2, 34, String(+ds.slice(8)), { fs: 10, anchor: 'middle', fill: COL.sub }));
  }
  out.push(`<path d="M0 ${TOP}H${gx + n * DW}" stroke="${COL.line}"/>`);
  my.tasks.forEach((x, k) => {
    const y = TOP + k * RH;
    out.push(`<path d="M0 ${y + RH}H${gx + n * DW}" stroke="${COL.grid}"/>`);
    const num = `${x.t.num} `, room = LW - 12 - textW(num, 12);
    let s = x.label;
    if (textW(s, 12) > room) { while (s.length > 1 && textW(`…${s}`, 12) > room) s = s.slice(1); s = `…${s}`; }
    out.push(`<g><title>${esc(`${x.t.num} ${x.label}`)}</title>${T_(4, y + 17, num + s, { fs: 12 })}</g>`);
    const bx = gx + (x.s - d0) * DW, bw = (x.e - x.s + 1) * DW;
    out.push(`<rect x="${bx}" y="${y + 5}" width="${bw}" height="12" ${x.status === 'todo' ? `fill="#fff" stroke="${COL.line}"` : `fill="${STATUS_FILL[x.status]}" stroke="${COL.line}" stroke-width="0.5"`}/>`);
    for (const d of worked.get(x.key) || []) out.push(`<circle cx="${gx + (d - d0) * DW + DW / 2}" cy="${y + 21.5}" r="2.5" fill="${COL.line}"/>`);
    if (x.late) out.push(`<circle cx="${bx + bw - 1}" cy="${y + 5}" r="4" fill="${COL.accent}" stroke="#fff" stroke-width="1"/>`);
  });
  const tx = gx + (today - d0) * DW;
  out.push(`<path d="M${tx} ${TOP - 4}V${TOP + my.tasks.length * RH}" stroke="${COL.accent}" stroke-width="1.5"/>`);
  return { frag: out.join(''), w: gx + n * DW + 4, h: TOP + my.tasks.length * RH + 4 };
}

// ---- 今週の予定(7.2 節): 予定の期間が今週にかかる担当のタスク
function weekPlan(my, today, ws) {

// ---- 計画の変更のうち自分に関係するもの(7.2 節): 照合に使える版の最後の 2 つを、対応名で比べる
function planChanges(a) {
  const V = a.V || [], me = a.who;
  if (V.length < 2) return null;
  // 最新の版と、それより前の日付の最後の版を比べる(同じ日付の途中の保存は比べない)。前の日付の版がなければ 1 つ前の版
  const B = V[V.length - 1];
  const A = V.slice(0, -1).filter((x) => x.date < B.date).pop() ?? V[V.length - 2];
  const map = (e) => new Map(e.r.tasks.map((t) => [keyOf(t), t]));
  const ta = map(A), tb = map(B);
  // 2 つの版の要素の対応(5.6 節。対応名が同じもの・移動)。名前の変更は対応しない
  const fw = verMap(A, B), bw = new Map([...fw].map(([x, y]) => [y, x]));

  const nodeIn = (e, k) => (k ? index(e).byKey.get(k) || null : null);
  const has = (t, k) => !!t && memberNames(t[k]).includes(me);
  const names = (t, k) => memberNames(t[k]).join('・') || '(なし)';
  const span = (e, t) => { const x = e.r.sched.start + t.d0, y = e.r.sched.start + t.d1; return x === y ? mmdd(x) : `${mmdd(x)}〜${mmdd(y)}`; };
  const parentOf = (n) => (n.parent && n.parent.parent ? labelOfNode(n.parent) : '(根)');
  const rows = [];
  const add = (kind, t, text) => rows.push({ kind, label: labelOfNode(t), text });
  for (const [k, t] of tb) {
    const k0 = bw.get(k) ?? null;
    const o = ta.get(k0) || nodeIn(A, k0);
    if (o && k0 !== k && (has(t, 'by') || has(o, 'by') || has(t, 'review') || has(o, 'review'))) add('移動', t, `親: ${parentOf(o)} → ${parentOf(t)}`);
    if (has(t, 'by') && !has(o, 'by')) add('作成者の追加', t, o ? `作成者: ${names(o, 'by')} → ${names(t, 'by')}` : `計画に追加(${span(B, t)}、${P.fmtDays(t.days)} 日)`);
    else if (has(t, 'by') && has(o, 'by') && ta.has(k0)) {
      const s0 = span(A, o), s1 = span(B, t);
      // 最新の版で完了のタスクは出さない(完了のタスクは版の日付の下限がなく、日程が前へ詰まることがあるため。7.2 節)
      if ((s0 !== s1 || o.days !== t.days) && t.status !== 'done') add('日程の変更', t, `${s0} → ${s1}${o.days !== t.days ? `(日数 ${P.fmtDays(o.days)} → ${P.fmtDays(t.days)})` : ''}`);
    }
    if (has(t, 'review') && !has(o, 'review')) add('確認者の追加', t, o ? `確認者: ${names(o, 'review')} → ${names(t, 'review')}` : `計画に追加(作成者: ${names(t, 'by')})`);
  }
  for (const [k, o] of ta) {
    const k1 = fw.get(k) ?? null;
    const t = tb.get(k1) || nodeIn(B, k1);
    if (has(o, 'by') && !has(t, 'by')) add('作成者の削除', o, t ? `作成者: ${names(o, 'by')} → ${names(t, 'by')}` : '計画から削除');
    if (has(o, 'review') && !has(t, 'review')) add('確認者の削除', o, t ? `確認者: ${names(o, 'review')} → ${names(t, 'review')}` : '計画から削除');
  }

  rows.sort((x, y) => KO.indexOf(x.kind) - KO.indexOf(y.kind));

// ---- 担当するテスト項目(7.6 節): 担当のタスクの対象(for:)の PBS の要素が実現する(realizes:)機能の MOP
function myTests(a, my, byKey) {

function memberLabel(i) { let s = ''; i += 1; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return `メンバー${s}`; }

    if (!label.has(m)) { label.set(m, memberLabel(label.size)); map.push([label.get(m), m]); }
    return label.get(m);
  });
  return { text: out, map };
}

  const date = v && typeof v.date === 'number' ? v.date : null;
  const errs = r.diags.filter((d) => d.level === 'error');
  return {
    name, text, r, date,
    // 最初のエラーは、行の番号がいちばん小さいもの(計算部は必須の節の欠けを最後に積むため、並びの先頭とは限らない)
    nErr: errs.length, firstErr: errs.length ? errs.reduce((x, y) => (y.line < x.line ? y : x)) : null,
    nWarn: r.diags.filter((d) => d.level === 'warn').length,

}
// 一覧の並び: 版の日付の古い順。同じ日付の中は今の並びを保つ(安定な並べ替え)。版の日付のない版は最後
const dateKey = (e) => (e.date === null ? Infinity : e.date);
const sortList = (list) => list.map((e, i) => [e, i]).sort((a, b) => dateKey(a[0]) - dateKey(b[0]) || a[1] - b[1]).map((x) => x[0]);
// 足す(仕様書 3.3 節)。テキストが一覧のどれかと同じ版は足さない。戻り値 { list, added, skipped }
function addEntries(list, entries) {
  const out = list.slice(), added = [], skipped = [];
  for (const e of entries) {
    const dup = out.find((x) => x.text === e.text);
    if (dup) { skipped.push({ name: e.name, dup: dup.name }); continue; }
    out.push(e); added.push(e);
  }
  return { list: sortList(out), added, skipped };
}
// 同じ日付の中だけ、1 つ前(dir = -1)か後ろ(dir = 1)と入れ替える。入れ替えられなければ null
function moveEntry(list, i, dir) {
  const j = i + dir;
  if (j < 0 || j >= list.length || list[i].date === null || list[j].date !== list[i].date) return null;
  const out = list.slice();
